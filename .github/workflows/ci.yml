name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: cargo fmt --all --check
      - run: cargo fmt --manifest-path web/tools/schema-gen/Cargo.toml --check
  macos:
    uses: ./.github/workflows/package-macos.yml
    with:
      ci: true
  linux:
    uses: ./.github/workflows/package-linux.yml
    with:
      ci: true
  windows:
    uses: ./.github/workflows/package-windows.yml
    with:
      ci: true
  web-engine:
    uses: ./.github/workflows/package-web-engine.yml
  complete:
    name: CI complete
    if: always()
    needs: [format, macos, linux, windows, web-engine]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every check
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          jq -e 'all(.[]; .result == "success")' <<< "$RESULTS"
