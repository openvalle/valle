name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Tests' backtraces keep their lines, and the Rust caches, a gigabyte a job with full debug
# information, fit the repository's 10 GB together.
env:
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the Rust toolchain
        run: rustup show
      # Only the long-lived branches write, so others cannot push them out.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/v1' }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ hashFiles('bun.lock') }}
      # The built-in fonts used by the unit and integration tests.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.valle/cache/files
          key: downloads-${{ hashFiles('crates/valle-engine/src/text.rs') }}
          restore-keys: downloads-
      # The FFmpeg used by the video integration tests, loaded at run time.
      - name: Install FFmpeg
        run: bun .github/scripts/install-ffmpeg.ts
      - name: Check formatting
        run: cargo xtask fmt --check
      - name: Lint
        run: cargo xtask lint
      # No GPU here: the gpu layer draws on the pinned lavapipe, as the executable does without
      # one. The browser layer runs in the gpu job.
      - name: Fetch lavapipe
        run: |
          driver=$(cargo xtask lavapipe)
          echo "VALLE_LAVAPIPE=$driver" >> "$GITHUB_ENV"
      - name: Test
        run: cargo xtask test --skip browser
      - name: Keep failed test results
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results-${{ runner.os }}
          path: target/test-results
          if-no-files-found: ignore

  gpu:
    # An Apple silicon virtual machine with a virtual Metal device.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the Rust toolchain
        run: rustup show
      # Only the long-lived branches write, so others cannot push them out.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/v1' }}
      # The built-in fonts used by the unit and integration tests.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.valle/cache/files
          key: downloads-${{ hashFiles('crates/valle-engine/src/text.rs') }}
          restore-keys: downloads-
      # LLVM's clang builds QuickJS for the browser's engine; Apple's builds no wasm32.
      - name: Install FFmpeg and LLVM
        run: brew install ffmpeg llvm
      # The browser layer: the SDK built with Bun, played in Playwright's Chromium.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/Library/Caches/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock') }}
      - name: Test
        run: cargo xtask test
      - name: Keep failed test results
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results-${{ runner.os }}
          path: target/test-results
          if-no-files-found: ignore

  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the Rust toolchain
        run: rustup show
      # Only the long-lived branches write, so others cannot push them out.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/v1' }}
      # The built-in fonts used by the unit and integration tests.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.valle/cache/files
          key: downloads-${{ hashFiles('crates/valle-engine/src/text.rs') }}
          restore-keys: downloads-
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - name: Install FFmpeg
        run: bun .github/scripts/install-ffmpeg.ts
      # No GPU here either: the gpu layer draws on lavapipe, unpacked into the global cache.
      - name: Fetch lavapipe
        run: |
          $driver = cargo xtask lavapipe
          if ($LASTEXITCODE -ne 0) { exit 1 }
          "VALLE_LAVAPIPE=$driver" >> $env:GITHUB_ENV
      - name: Test
        run: cargo xtask test --skip browser
      - name: Keep failed test results
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results-${{ runner.os }}
          path: target/test-results
          if-no-files-found: ignore

  web:
    # Studio and the browser engine, the same on every platform: built once, for each package to
    # embed. Windows's clang cannot build QuickJS for wasm32 with the headers rquickjs carries.
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/v1' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the Rust toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/v1' }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ hashFiles('bun.lock') }}
      # wasm-bindgen's CLI, which xtask installs at the version it pins: a minute and a half to
      # build, and in target/tools, which the Rust cache does not keep.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/tools
          key: wasm-bindgen-${{ runner.os }}-${{ hashFiles('xtask/src/main.rs') }}
          restore-keys: wasm-bindgen-${{ runner.os }}-
      # QuickJS is C, built for wasm32 by the runner's LLVM; Ubuntu names its tools by version.
      - name: Choose the wasm32 C tools
        run: |
          echo "CC_wasm32_unknown_unknown=clang-18" >> "$GITHUB_ENV"
          echo "AR_wasm32_unknown_unknown=llvm-ar-18" >> "$GITHUB_ENV"
      - name: Build Studio and the browser engine
        run: cargo xtask build-web
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web
          path: |
            web/apps/studio/dist
            web/packages/engine/dist
            web/packages/engine/LICENSE
          if-no-files-found: error

  package-linux:
    # Built in manylinux_2_28, AlmaLinux 8's glibc: the package runs where glibc is 2.28 or later,
    # as the lavapipe it embeds does. Drawing in it is the check that it does.
    needs: web
    name: package (linux-${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    container: quay.io/pypa/manylinux_2_28_${{ matrix.arch == 'arm64' && 'aarch64' || 'x86_64' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # libclang, for the FFmpeg bindings.
      - name: Install clang and the Rust toolchain
        run: |
          dnf install -y -q clang-devel
          curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          "$HOME/.cargo/bin/rustup" show
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: manylinux
          save-if: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/v1' }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web
          path: web
      - name: Package
        run: cargo xtask package --web-built
      - name: Need no glibc past 2.28
        run: |
          newest=$(objdump -T dist/valle | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -1)
          echo "$newest"
          test "$(printf '%s\nGLIBC_2.28\n' "$newest" | sort -V | tail -1)" = GLIBC_2.28
      # No GPU here: it must draw on the lavapipe it carries.
      - name: Draw on the embedded lavapipe
        run: |
          result=$(dist/valle motion render examples/01-kinetic-title.motion.tsx --frame 30 -o frame.png --json)
          echo "$result"
          grep -q '(bundled lavapipe)' <<< "$result"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: valle-linux-${{ matrix.arch }}
          path: dist/valle
          if-no-files-found: error

  package:
    # The executables a release ships, built from each push to a long-lived branch or a version
    # tag, with Studio embedded, and the pinned lavapipe on Windows.
    needs: web
    name: package (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-arm64
            runner: macos-15
          - platform: macos-x86_64
            runner: macos-15-intel
          - platform: windows-x86_64
            runner: windows-2022
          - platform: windows-arm64
            runner: windows-11-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the Rust toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/v1' }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web
          path: web
      - name: Package
        run: cargo xtask package --web-built
      # The package alone, with no GPU: it must draw on the lavapipe it carries.
      - name: Draw on the embedded lavapipe
        if: runner.os == 'Windows'
        shell: bash
        run: |
          result=$(dist/valle motion render examples/01-kinetic-title.motion.tsx --frame 30 -o frame.png --json)
          echo "$result"
          grep -q '(bundled lavapipe)' <<< "$result"
      # macOS carries no lavapipe: it draws on Metal, the runner's virtual device.
      - name: Draw on Metal
        if: runner.os == 'macOS'
        run: |
          result=$(dist/valle motion render examples/01-kinetic-title.motion.tsx --frame 30 -o frame.png --json)
          echo "$result"
          grep -q '"status":"ok"' <<< "$result"
      # A release's macOS executable is signed with the Developer ID and notarized, so Gatekeeper
      # opens it once downloaded; branch builds stay ad-hoc signed.
      - name: Import the Developer ID certificate
        if: runner.os == 'macOS' && startsWith(github.ref, 'refs/tags/v')
        uses: apple-actions/import-codesign-certs@5142e029c445c10ffc7149d172e540235a065466 # v7.0.0
        with:
          p12-file-base64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          p12-password: ${{ secrets.MACOS_CERT_PASSWORD }}
      - name: Sign and notarize
        if: runner.os == 'macOS' && startsWith(github.ref, 'refs/tags/v')
        env:
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
        run: |
          # The hardened runtime, but loading the user's FFmpeg, which another team signed.
          entitlements="$RUNNER_TEMP/entitlements.plist"
          cat > "$entitlements" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <plist version="1.0"><dict>
            <key>com.apple.security.cs.disable-library-validation</key><true/>
          </dict></plist>
          PLIST
          codesign --force --timestamp --options runtime --identifier org.openvalle.valle \
            --entitlements "$entitlements" --sign "$MACOS_SIGN_IDENTITY" dist/valle
          codesign --verify --strict --verbose=2 dist/valle
          umask 077
          key="$RUNNER_TEMP/AuthKey.p8"
          trap 'rm -f "$key"' EXIT
          printf '%s' "$APPLE_API_KEY_P8_BASE64" | base64 --decode > "$key"
          ditto -c -k --keepParent dist/valle "$RUNNER_TEMP/notarize.zip"
          # A bare executable cannot be stapled: Gatekeeper finds the ticket online.
          xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" --key "$key" \
            --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER_ID" --wait --timeout 60m \
            --output-format json | tee notary.json
          jq -e '.status == "Accepted"' notary.json
          dist/valle --version
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: valle-${{ matrix.platform }}
          path: |
            dist/valle
            dist/valle.exe
          if-no-files-found: error

  release:
    # A version tag drafts a GitHub release of the packages, for a person to read and publish.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [check, gpu, windows, package-linux, package]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check the tag names the workspace's version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          test "$GITHUB_REF_NAME" = "v$version"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: valle-*
          path: artifacts
      # Artifacts lose the executable bit; the archives give it back.
      - name: Archive the packages
        run: |
          mkdir release
          for platform in linux-x86_64 linux-arm64 macos-arm64 macos-x86_64; do
            chmod +x "artifacts/valle-$platform/valle"
            tar -czf "release/valle-$GITHUB_REF_NAME-$platform.tar.gz" -C "artifacts/valle-$platform" valle
          done
          for platform in windows-x86_64 windows-arm64; do
            (cd "artifacts/valle-$platform" && zip -9 "../../release/valle-$GITHUB_REF_NAME-$platform.zip" valle.exe)
          done
          (cd release && sha256sum -- * > SHA256SUMS && cat SHA256SUMS)
      - name: Draft the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release/* --repo "$GITHUB_REPOSITORY" --verify-tag \
            --draft --title "Valle $GITHUB_REF_NAME" --generate-notes

  npm:
    # The browser engine, @openvalle/engine, from the web job's build. NPM_TOKEN publishes it;
    # the provenance links the package to this run.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [check, gpu, windows, web]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web
          path: web
      - name: Check the tag names the package's version
        working-directory: web/packages/engine
        run: test "$GITHUB_REF_NAME" = "v$(node -p 'require("./package.json").version')"
      - name: Publish
        working-directory: web/packages/engine
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          npm config set //registry.npmjs.org/:_authToken "$NPM_TOKEN"
          npm publish --provenance --access public
