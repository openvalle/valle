name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the Rust toolchain
        run: rustup show
      # Only the long-lived branches write, so others cannot push them out.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/v1' }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ hashFiles('bun.lock') }}
      # The fonts the tests download, built-in and test ones, as files/<SHA-256>/<name>.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.valle/cache/files
          key: downloads-${{ hashFiles('crates/valle-engine/src/text.rs', 'crates/valle-engine/tests/cases/main.rs') }}
          restore-keys: downloads-
      - name: Check formatting
        run: cargo xtask fmt --check
      - name: Lint
        run: cargo xtask lint
      # No GPU here: the gpu job runs that layer.
      - name: Test
        run: cargo xtask test --skip gpu,browser

  gpu:
    # An Apple silicon virtual machine with a virtual Metal device.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the Rust toolchain
        run: rustup show
      # Only the long-lived branches write, so others cannot push them out.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/v1' }}
      # The fonts the tests download, built-in and test ones, as files/<SHA-256>/<name>.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.valle/cache/files
          key: downloads-${{ hashFiles('crates/valle-engine/src/text.rs', 'crates/valle-engine/tests/cases/main.rs') }}
          restore-keys: downloads-
      - name: Test
        run: cargo xtask test
      - name: Keep the frames to review
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: review
          path: target/review
          if-no-files-found: ignore

  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the Rust toolchain
        run: rustup show
      # Only the long-lived branches write, so others cannot push them out.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/v1' }}
      # The fonts the tests download, built-in and test ones, as files/<SHA-256>/<name>.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.valle/cache/files
          key: downloads-${{ hashFiles('crates/valle-engine/src/text.rs', 'crates/valle-engine/tests/cases/main.rs') }}
          restore-keys: downloads-
      # No GPU here either.
      - name: Test
        run: cargo xtask test --skip gpu,browser
