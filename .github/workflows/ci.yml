name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the Rust toolchain
        run: rustup show
      # Only the long-lived branches write, so others cannot push them out.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/v1' }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ hashFiles('bun.lock') }}
      # The built-in fonts used by the unit and integration tests.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.valle/cache/files
          key: downloads-${{ hashFiles('crates/valle-engine/src/text.rs') }}
          restore-keys: downloads-
      # The FFmpeg used by the video integration tests, loaded at run time.
      - name: Install FFmpeg
        run: bun .github/scripts/install-ffmpeg.ts
      - name: Check formatting
        run: cargo xtask fmt --check
      - name: Lint
        run: cargo xtask lint
      # No GPU here: the gpu layer draws on the pinned lavapipe, as the executable does without
      # one. The browser layer runs in the gpu job.
      - name: Fetch lavapipe
        run: |
          driver=$(cargo xtask lavapipe)
          echo "VALLE_LAVAPIPE=$driver" >> "$GITHUB_ENV"
      - name: Test
        run: cargo xtask test --skip browser
      - name: Keep failed test results
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results-${{ runner.os }}
          path: target/test-results
          if-no-files-found: ignore

  gpu:
    # An Apple silicon virtual machine with a virtual Metal device.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the Rust toolchain
        run: rustup show
      # Only the long-lived branches write, so others cannot push them out.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/v1' }}
      # The built-in fonts used by the unit and integration tests.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.valle/cache/files
          key: downloads-${{ hashFiles('crates/valle-engine/src/text.rs') }}
          restore-keys: downloads-
      # LLVM's clang builds QuickJS for the browser's engine; Apple's builds no wasm32.
      - name: Install FFmpeg and LLVM
        run: brew install ffmpeg llvm
      # The browser layer: the SDK built with Bun, played in Playwright's Chromium.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/Library/Caches/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock') }}
      - name: Test
        run: cargo xtask test
      - name: Keep failed test results
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results-${{ runner.os }}
          path: target/test-results
          if-no-files-found: ignore

  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the Rust toolchain
        run: rustup show
      # Only the long-lived branches write, so others cannot push them out.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/v1' }}
      # The built-in fonts used by the unit and integration tests.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.valle/cache/files
          key: downloads-${{ hashFiles('crates/valle-engine/src/text.rs') }}
          restore-keys: downloads-
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - name: Install FFmpeg
        run: bun .github/scripts/install-ffmpeg.ts
      # No GPU here either: the gpu layer draws on lavapipe, unpacked into the global cache.
      - name: Fetch lavapipe
        run: |
          $driver = cargo xtask lavapipe
          if ($LASTEXITCODE -ne 0) { exit 1 }
          "VALLE_LAVAPIPE=$driver" >> $env:GITHUB_ENV
      - name: Test
        run: cargo xtask test --skip browser
      - name: Keep failed test results
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results-${{ runner.os }}
          path: target/test-results
          if-no-files-found: ignore

  package:
    # The executables a release ships, built from each push to a long-lived branch, with Studio
    # and the pinned lavapipe embedded.
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/v1')
    name: package (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86_64
            runner: ubuntu-24.04
          - platform: windows-x86_64
            runner: windows-2022
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the Rust toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/v1' }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      # QuickJS is C, built for wasm32 by the runner's LLVM; Ubuntu names its tools by version.
      - name: Choose the wasm32 C tools
        if: runner.os == 'Linux'
        run: |
          echo "CC_wasm32_unknown_unknown=clang-18" >> "$GITHUB_ENV"
          echo "AR_wasm32_unknown_unknown=llvm-ar-18" >> "$GITHUB_ENV"
      - name: Package
        run: cargo xtask package
      # The package alone, with no GPU: it must draw on the lavapipe it carries.
      - name: Draw on the embedded lavapipe
        shell: bash
        run: |
          result=$(dist/valle motion render examples/01-kinetic-title.motion.tsx --frame 30 -o frame.png --json)
          echo "$result"
          grep -q '(bundled lavapipe)' <<< "$result"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: valle-${{ matrix.platform }}
          path: |
            dist/valle
            dist/valle.exe
          if-no-files-found: error
