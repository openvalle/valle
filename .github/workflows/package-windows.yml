name: Package Windows x86_64

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: package-windows-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: pwsh

jobs:
  package:
    runs-on: windows-2022
    timeout-minutes: 240
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_NET_RETRY: '3'
      FORCE_SKIA_BUILD: '1'
    steps:
      - name: Set cache and log directories
        id: environment
        shell: pwsh
        run: |
          "BUN_INSTALL_CACHE_DIR=$env:RUNNER_TEMP/valle-bun-cache" >> $env:GITHUB_ENV
          "PACKAGE_LOGS=$env:RUNNER_TEMP/valle-package-logs" >> $env:GITHUB_ENV
          "image=$env:ImageVersion" >> $env:GITHUB_OUTPUT
          New-Item -ItemType Directory -Force "$env:RUNNER_TEMP/valle-package-logs" | Out-Null
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: web/package.json
      - name: Cache build dependencies
        id: dependencies
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: windows-2022-${{ runner.arch }}-${{ steps.environment.outputs.image }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', '.cargo/config.toml', 'web/bun.lock', 'web/package.json') }}
          restore-keys: windows-2022-${{ runner.arch }}-${{ steps.environment.outputs.image }}-
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/debug
            target/release
            target/wasm32-unknown-unknown
            target/tools
            ${{ env.BUN_INSTALL_CACHE_DIR }}
      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        with:
          arch: x64
      - name: Prepare LLVM and linker
        run: |
          # Git's link.exe is a different tool; Cargo must use the MSVC linker.
          $linker = Join-Path $env:VCToolsInstallDir 'bin/Hostx64/x64/link.exe'
          if (!(Test-Path $linker -PathType Leaf)) { throw 'MSVC x64 linker is missing' }
          "CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER=$linker" >> $env:GITHUB_ENV
          $llvm = "$env:ProgramFiles/LLVM"
          if (!(Test-Path "$llvm/bin/libclang.dll")) { throw 'LLVM libclang.dll is missing' }
          "LLVM_HOME=$llvm" >> $env:GITHUB_ENV
          "LIBCLANG_PATH=$llvm/bin" >> $env:GITHUB_ENV
          "$llvm/bin" >> $env:GITHUB_PATH
      - name: Record build environment
        run: |
          rustup show
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustc -vV | Tee-Object -FilePath "$env:PACKAGE_LOGS/toolchain.txt"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (!(Select-String -Path "$env:PACKAGE_LOGS/toolchain.txt" -SimpleMatch 'host: x86_64-pc-windows-msvc' -Quiet)) {
            throw 'Expected the x64 MSVC Rust toolchain'
          }
          foreach ($tool in @('clang', 'python', 'bun', 'cmake', 'ninja')) {
            & $tool --version | Tee-Object -FilePath "$env:PACKAGE_LOGS/toolchain.txt" -Append
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          Get-Command link.exe | Format-List Source
      - name: Check packaging tool
        run: cargo test --locked -p xtask 2>&1 | Tee-Object -FilePath "$env:PACKAGE_LOGS/xtask-tests.log"
      - name: Build and verify single executable
        run: cargo xtask package 2>&1 | Tee-Object -FilePath "$env:PACKAGE_LOGS/package.log"
      - name: Record and verify startup libraries
        run: |
          llvm-readobj --file-headers --coff-imports ./dist/bin/valle.exe | Tee-Object -FilePath "$env:PACKAGE_LOGS/startup-libraries.txt"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (Select-String -Path "$env:PACKAGE_LOGS/startup-libraries.txt" -Pattern '(avcodec|avformat|avutil|swscale|swresample).*\.dll' -Quiet) {
            throw 'Executable links FFmpeg at startup'
          }
      - name: Test Web runtime contracts
        working-directory: web
        run: |
          bun run typecheck 2>&1 | Tee-Object -FilePath "$env:PACKAGE_LOGS/web-typecheck.log"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          bun test scripts/runtime-manifest.test.ts packages/player-core/src/runtime-assets.test.ts apps/studio/src/host.test.ts apps/studio/src/timeline-workspace-runtime.test.ts packages/player/src/controller.test.ts 2>&1 | Tee-Object -FilePath "$env:PACKAGE_LOGS/web-tests.log"
      - name: Test native Web and runtime contracts
        env:
          VALLE_EMBED_WEB_DIR: ${{ github.workspace }}/web/dist
          VALLE_EMBED_NOTICES: ${{ github.workspace }}/target/distribution-notices.txt
        run: cargo test --locked --release -p valle-cli --features embedded-runtime --test web_runtime --test ffmpeg_runtime -- --test-threads=1 2>&1 | Tee-Object -FilePath "$env:PACKAGE_LOGS/cli-tests.log"
      - name: Archive executable and verify extraction
        working-directory: target/package
        shell: pwsh
        run: |
          $binary = Get-Item 'valle.exe'
          $version = & .\valle.exe --version
          if ($LASTEXITCODE -ne 0) { throw 'Cannot read executable version' }
          $archive = "valle-v$($version -replace '^valle ', '')-windows-x86_64.zip"
          Compress-Archive -LiteralPath $binary.Name, 'SHA256SUMS' -DestinationPath $archive
          $hash = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content "$archive.sha256" "$hash  $archive`n" -NoNewline -Encoding ascii
          $extracted = Join-Path $env:RUNNER_TEMP "valle-package-$([guid]::NewGuid())"
          Expand-Archive -LiteralPath $archive -DestinationPath $extracted
          foreach ($name in @($binary.Name, 'SHA256SUMS')) {
            if ((Get-FileHash $name).Hash -ne (Get-FileHash (Join-Path $extracted $name)).Hash) {
              throw "Archive changed $name"
            }
          }
          & (Join-Path $extracted $binary.Name) --version
          if ($LASTEXITCODE -ne 0) { throw 'Extracted executable failed to start' }
      - name: Verify download checksum
        working-directory: target/package
        run: |
          $manifests = @(Get-Item 'SHA256SUMS') + @(Get-ChildItem -File '*.zip.sha256')
          foreach ($manifest in $manifests) {
            foreach ($line in Get-Content $manifest.FullName) {
              if ($line -notmatch '^([a-fA-F0-9]{64}) [ *](.+)$') { throw "Invalid checksum: $line" }
              $expected = $Matches[1]
              $file = $Matches[2]
              if ((Get-FileHash -LiteralPath $file -Algorithm SHA256).Hash -ne $expected) {
                throw "Checksum mismatch: $file"
              }
              "${file}: OK" | Tee-Object -FilePath "$env:PACKAGE_LOGS/checksum.log" -Append
            }
          }
      - name: Upload executable archive and checksum
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: valle-windows-x86_64-${{ github.sha }}
          path: |
            target/package/valle-*-windows-x86_64.zip
            target/package/valle-*-windows-x86_64.zip.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
      - name: Save build dependencies even after a failed build
        if: always() && steps.dependencies.outcome == 'success' && steps.dependencies.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: ${{ steps.dependencies.outputs.cache-primary-key }}
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/debug
            target/release
            target/wasm32-unknown-unknown
            target/tools
            ${{ env.BUN_INSTALL_CACHE_DIR }}
      - name: Upload build and test diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: valle-package-diagnostics-windows-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ env.PACKAGE_LOGS }}
          if-no-files-found: warn
          retention-days: 14
