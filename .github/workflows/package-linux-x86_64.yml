name: Package Linux x86_64

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      ci:
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: package-linux-x86_64-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    uses: ./.github/workflows/build-linux.yml
    with:
      ci: ${{ inputs.ci || false }}
      arch: x86_64
      target: x86_64-unknown-linux-gnu
      machine: x86_64
