[package]
name = "valle-motion"
description = "Motion Artifacts, deterministic evaluation, layout, text, and DrawProgram emission."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
# Keep dependencies Wasm-compatible; compilation depends on Motion, never the reverse.
valle-timeline.workspace = true
valle-draw.workspace = true
cssparser.workspace = true
geo = { workspace = true, features = ["earcut"] }
i_overlay.workspace = true
libm.workspace = true
num-bigint = "0.4.8"
num-rational = "0.4.2"
num-traits = "0.2.19"
serde.workspace = true
sha2.workspace = true
hex.workspace = true
serde_json.workspace = true
ts-rs = { workspace = true, optional = true }
takumi-core.workspace = true
parley.workspace = true
ratex-types.workspace = true
ratex-font.workspace = true
ratex-lexer.workspace = true
ratex-parser.workspace = true
ratex-layout.workspace = true
thiserror.workspace = true
ttf-parser.workspace = true
image = { workspace = true, features = ["hdr"] }

[package.metadata.cargo-machete]
ignored = ["parley"]

[features]
default = []
ts = ["dep:ts-rs", "valle-draw/ts"]
