[package]
name = "valle-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "valle"
path = "src/main.rs"

[features]
# `cargo xtask package` builds the web assets first, then embeds them in the executable.
embed-web = ["dep:brotli", "dep:brotli-decompressor"]
# On Linux and Windows, `cargo xtask package` embeds lavapipe, the driver $VALLE_LAVAPIPE names,
# for machines without a GPU.
embed-lavapipe = []

[build-dependencies]
brotli = { workspace = true, optional = true }

[dependencies]
brotli-decompressor = { workspace = true, optional = true }
clap.workspace = true
flate2.workspace = true
png.workspace = true
rfd.workspace = true
ring.workspace = true
serde_json.workspace = true
ureq.workspace = true
valle-engine = { path = "../valle-engine" }
valle-native = { path = "../valle-native" }
valle-project = { path = "../valle-project" }
valle-timeline = { path = "../valle-timeline" }

[dev-dependencies]
indoc.workspace = true
