[package]
name = "valle-web"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

# Only the browser's build has anything: the SDK's engine, which `cargo xtask build` makes.
[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"
serde_json.workspace = true
valle-engine = { path = "../valle-engine" }
valle-timeline = { path = "../valle-timeline" }
# The CLI that makes the module's JavaScript must be this version, as `cargo xtask build` checks.
wasm-bindgen = "=0.2.128"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["console", "OffscreenCanvas"] }
wgpu = { workspace = true, features = ["webgpu"] }
