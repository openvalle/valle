[package]
name = "valle-web"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
valle-engine = { path = "../valle-engine" }

# The SDK's browser bindings, built by `cargo xtask build-web`.
[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3.107"
serde_json.workspace = true
valle-timeline = { path = "../valle-timeline" }
# The CLI that makes the module's JavaScript must be this version, as `cargo xtask build` checks.
wasm-bindgen = "=0.2.130"
wasm-bindgen-futures = "0.4.80"
web-sys = { version = "0.3.107", features = ["console", "OffscreenCanvas"] }
wgpu = { workspace = true, features = ["webgpu"] }
