[package]
name = "valle-engine"
description = "Shared native and web evaluation, preparation, and composition."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
valle-timeline.workspace = true
valle-compiler.workspace = true
valle-motion.workspace = true
valle-draw.workspace = true
serde = { workspace = true, features = ["rc"] }
serde_json.workspace = true
serde_jcs.workspace = true
sha2.workspace = true
base64.workspace = true
thiserror.workspace = true

cosmic-text = { workspace = true, optional = true }
ttf-parser.workspace = true
swash = { workspace = true, optional = true }
wasm-bindgen = { workspace = true, optional = true }
js-sys = { workspace = true, optional = true }

[features]
default = []
# Pure Rust shaping and glyph rendering shared by native and Wasm hosts.
text = ["dep:cosmic-text", "dep:swash"]
web = ["text", "dep:wasm-bindgen", "dep:js-sys"]

[dev-dependencies]
png.workspace = true
valle-compiler = { workspace = true, features = ["motion"] }
valle-media = { workspace = true, features = ["libav"] }
