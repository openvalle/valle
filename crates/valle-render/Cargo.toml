[package]
name = "valle-render"
description = "Native rendering, scheduling, output sinks, and Skia execution."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[build-dependencies]
cc = "1"

[dependencies]
valle-engine.workspace = true
valle-media.workspace = true
valle-draw = { workspace = true, optional = true }
anyhow.workspace = true
thiserror.workspace = true
crossbeam-channel = { workspace = true, optional = true }
png = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true }
fs2 = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
hex = { workspace = true, optional = true }
tempfile = { workspace = true, optional = true }
skia-safe = { workspace = true, optional = true }
ttf-parser = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
[features]
default = []
# Standalone Motion rendering without libav.
motion = ["dep:skia-safe", "dep:valle-draw", "dep:serde_json"]
# Native encoding, text, rasterization, and remote assets.
native = ["motion", "valle-media/libav", "valle-engine/text", "dep:crossbeam-channel", "dep:png", "dep:reqwest", "dep:fs2", "dep:sha2", "dep:hex", "dep:tempfile", "dep:ttf-parser", "dep:objc2", "dep:objc2-metal", "dep:skia-bindings", "dep:wgpu", "dep:pollster", "dep:ash"]

[target.'cfg(any(target_os = "linux", target_os = "windows"))'.dependencies]
skia-bindings = { workspace = true, optional = true }
skia-safe = { workspace = true, optional = true, features = ["vulkan", "ganesh"] }
# Load the driver at runtime so the same binary also works without a Vulkan installation.
ash = { version = "0.38.0", default-features = false, features = ["loaded", "std"], optional = true }
wgpu = { version = "30.0.1", default-features = false, features = ["std", "vulkan", "wgsl"], optional = true }
pollster = { version = "0.4.0", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
skia-safe = { workspace = true, optional = true, features = ["metal", "ganesh"] }
objc2 = { workspace = true, optional = true }
objc2-metal = { workspace = true, features = ["std", "MTLDevice", "MTLCommandQueue"], optional = true }
skia-bindings = { workspace = true, optional = true }
wgpu = { version = "30.0.1", default-features = false, features = ["std", "metal", "wgsl"], optional = true }
pollster = { version = "0.4.0", optional = true }

[dev-dependencies]
valle-motion.workspace = true
cosmic-text.workspace = true
serde_json.workspace = true
libc.workspace = true
valle-compiler = { workspace = true, features = ["motion"] }

[target.'cfg(target_os = "macos")'.dev-dependencies]
wgpu = { version = "30.0.1", default-features = false, features = ["std", "metal", "wgsl"] }
pollster = "0.4.0"

[[test]]
name = "product_executor"
required-features = ["motion"]

[[test]]
name = "product_host"
required-features = ["native"]

[[test]]
name = "scene3d_fixed_package"
required-features = ["native"]

[[test]]
name = "scene3d_gpu_interop"
required-features = ["native"]

[[example]]
name = "performance_fixed_package"
required-features = ["native"]
