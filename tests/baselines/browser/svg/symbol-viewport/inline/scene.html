<!doctype html>
<html lang="en">
  <meta charset="utf-8" /><title>svg/symbol-viewport/inline</title
  ><style>
    @font-face {
      font-family: "Test Sans";
      src: url("/tests/resources/NotoSans.ttf");
      font-weight: 100 900;
    }
    @font-face {
      font-family: "Test Sans";
      src: url("/tests/resources/NotoSansItalic.ttf");
      font-weight: 100 900;
      font-style: italic;
    }
    body {
      margin: 0;
    }
    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }
    #canvas {
      position: relative;
      width: 340px;
      height: 180px;
      background: white;
    }
    img {
      display: block;
    }
  </style>
  <div id="canvas">
    <svg data-key="drawing" xmlns="http://www.w3.org/2000/svg" width="340" height="180">
      <defs>
        <symbol id="tile" viewBox="0 0 100 50" preserveAspectRatio="xMidYMid meet">
          <rect width="100" height="50" fill="#176bba" />
          <rect x="25" y="10" width="50" height="30" fill="#ffb74d" />
        </symbol>
        <clipPath id="clip"><rect x="180" y="40" width="110" height="80" /></clipPath>
      </defs>
      <use href="#tile" x="20" y="20" width="140" height="140" />
      <g clip-path="url(#clip)" opacity="0.5">
        <use href="#tile" x="180" y="20" width="140" height="140" />
      </g>
    </svg>
  </div>
</html>
