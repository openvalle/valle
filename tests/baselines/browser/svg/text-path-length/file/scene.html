<!doctype html>
<html lang="en">
  <meta charset="utf-8" /><title>text-path-length</title
  ><style>
    @font-face {
      font-family: TestSans;
      src: url(/tests/resources/NotoSans.ttf);
      font-weight: 100 900;
    }
    svg {
      font-family: TestSans;
    }
    body {
      margin: 0;
    }
    * {
      box-sizing: border-box;
    }
    #canvas {
      width: 320px;
      height: 180px;
      background: white;
    }
    svg,
    img {
      display: block;
    }
  </style>
  <div id="canvas"></div>
  <script>
    fetch("/tests/cases/svg/text-path-length/file/source.svg")
      .then((r) => r.text())
      .then((s) => {
        document.querySelector("#canvas").innerHTML = s;
        document.querySelector("svg").style.isolation = "isolate";
      });
  </script>
</html>
