<!doctype html>
<html lang="en">
  <meta charset="utf-8" /><title>svg/use-symbol/inline</title
  ><style>
    @font-face {
      font-family: "Test Sans";
      src: url("/tests/resources/NotoSans.ttf");
      font-weight: 100 900;
    }
    @font-face {
      font-family: "Test Sans";
      src: url("/tests/resources/NotoSansItalic.ttf");
      font-weight: 100 900;
      font-style: italic;
    }
    body {
      margin: 0;
    }
    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }
    #canvas {
      position: relative;
      width: 340px;
      height: 180px;
      background: white;
    }
    img {
      display: block;
    }
  </style>
  <div id="canvas">
    <svg data-key="drawing" xmlns="http://www.w3.org/2000/svg" width="340" height="180">
      <defs>
        <g id="tile">
          <rect width="40" height="40" />
          <rect x="10" y="10" width="20" height="20" fill="#ffb74d" />
        </g>
        <symbol id="badge" viewBox="0 0 40 40">
          <rect width="40" height="40" fill="#16a085" />
          <path d="M10 20h20M20 10v20" stroke="white" stroke-width="4" />
        </symbol>
      </defs>
      <use href="#tile" x="20" y="30" fill="#176bba" />
      <use href="#tile" x="90" y="30" fill="#ad1457" />
      <use href="#badge" x="160" y="20" width="80" height="120" />
      <use href="#badge" x="260" y="20" width="40" height="120" />
    </svg>
  </div>
</html>
