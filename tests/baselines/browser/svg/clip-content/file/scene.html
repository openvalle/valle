<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      @font-face {
        font-family: TestSans;
        src: url("/tests/resources/NotoSans.ttf");
        font-weight: 100 900;
      }
      body {
        margin: 0;
      }
      #canvas {
        width: 380px;
        height: 230px;
        background: white;
      }
      svg {
        display: block;
      }
    </style>
  </head>
  <body>
    <div id="canvas"></div>
    <script>
      fetch("/tests/cases/svg/clip-content/file/source.svg")
        .then((r) => r.text())
        .then((s) => {
          document.querySelector("#canvas").innerHTML = s;
          document.querySelector("svg").style.fontFamily = "TestSans";
        });
    </script>
  </body>
</html>
