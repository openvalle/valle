<!doctype html>
<html lang="en">
  <meta charset="utf-8" /><title>svg/clip-units/inline</title
  ><style>
    @font-face {
      font-family: "Test Sans";
      src: url("/tests/resources/NotoSans.ttf");
      font-weight: 100 900;
    }
    @font-face {
      font-family: "Test Sans";
      src: url("/tests/resources/NotoSansItalic.ttf");
      font-weight: 100 900;
      font-style: italic;
    }
    body {
      margin: 0;
    }
    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }
    #canvas {
      position: relative;
      width: 340px;
      height: 180px;
      background: white;
    }
    img {
      display: block;
    }
  </style>
  <div id="canvas">
    <svg data-key="drawing" xmlns="http://www.w3.org/2000/svg" width="340" height="180">
      <defs>
        <clipPath id="user" clipPathUnits="userSpaceOnUse">
          <rect x="30" y="30" width="80" height="100" />
        </clipPath>
        <clipPath id="bounds" clipPathUnits="objectBoundingBox">
          <rect x="0.25" y="0.25" width="0.5" height="0.5" />
        </clipPath>
      </defs>
      <rect x="20" y="20" width="120" height="120" fill="#176bba" clip-path="url(#user)" />
      <rect x="180" y="20" width="120" height="120" fill="#16a085" clip-path="url(#bounds)" />
    </svg>
  </div>
</html>
