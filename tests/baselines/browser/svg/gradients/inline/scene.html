<!doctype html>
<html lang="en">
  <meta charset="utf-8" /><title>svg/gradients/inline</title
  ><style>
    @font-face {
      font-family: "Test Sans";
      src: url("/tests/resources/NotoSans.ttf");
      font-weight: 100 900;
    }
    @font-face {
      font-family: "Test Sans";
      src: url("/tests/resources/NotoSansItalic.ttf");
      font-weight: 100 900;
      font-style: italic;
    }
    body {
      margin: 0;
    }
    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }
    #canvas {
      position: relative;
      width: 340px;
      height: 180px;
      background: white;
    }
    img {
      display: block;
    }
  </style>
  <div id="canvas">
    <svg data-key="drawing" xmlns="http://www.w3.org/2000/svg" width="340" height="180">
      <defs>
        <linearGradient id="linear">
          <stop offset="0" stop-color="#000000" />
          <stop offset="1" stop-color="#ffffff" />
        </linearGradient>
        <linearGradient id="hard" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0.5" stop-color="#176bba" />
          <stop offset="0.5" stop-color="#ffb74d" />
        </linearGradient>
        <radialGradient id="radial">
          <stop offset="0" stop-color="#ffffff" />
          <stop offset="1" stop-color="#176bba" />
        </radialGradient>
      </defs>
      <rect x="20" y="20" width="90" height="120" fill="url(#linear)" />
      <rect x="125" y="20" width="90" height="120" fill="url(#hard)" />
      <rect x="230" y="20" width="90" height="120" fill="url(#radial)" />
    </svg>
  </div>
</html>
