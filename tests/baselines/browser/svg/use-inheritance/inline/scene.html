<!doctype html>
<html lang="en">
  <meta charset="utf-8" /><title>svg/use-inheritance/inline</title
  ><style>
    @font-face {
      font-family: "Test Sans";
      src: url("/tests/resources/NotoSans.ttf");
      font-weight: 100 900;
    }
    @font-face {
      font-family: "Test Sans";
      src: url("/tests/resources/NotoSansItalic.ttf");
      font-weight: 100 900;
      font-style: italic;
    }
    body {
      margin: 0;
    }
    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }
    #canvas {
      position: relative;
      width: 340px;
      height: 180px;
      background: white;
    }
    img {
      display: block;
    }
  </style>
  <div id="canvas">
    <svg data-key="drawing" xmlns="http://www.w3.org/2000/svg" width="340" height="180">
      <defs>
        <g id="shape">
          <rect width="80" height="100" fill="currentColor" />
          <rect x="20" y="20" width="40" height="60" />
        </g>
        <g id="shift"><use href="#shape" x="10" y="10" /></g>
      </defs>
      <use href="#shape" x="20" y="20" color="#176bba" fill="#ffb74d" />
      <use href="#shift" x="120" y="10" color="#16a085" fill="#176bba" />
      <use href="#shift" transform="translate(225 20) scale(0.8)" color="#ffb74d" fill="#16a085" />
    </svg>
  </div>
</html>
