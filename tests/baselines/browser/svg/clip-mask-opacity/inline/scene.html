<!doctype html>
<html lang="en">
  <meta charset="utf-8" /><title>svg/clip-mask-opacity/inline</title
  ><style>
    @font-face {
      font-family: "Test Sans";
      src: url("/tests/resources/NotoSans.ttf");
      font-weight: 100 900;
    }
    @font-face {
      font-family: "Test Sans";
      src: url("/tests/resources/NotoSansItalic.ttf");
      font-weight: 100 900;
      font-style: italic;
    }
    body {
      margin: 0;
    }
    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }
    #canvas {
      position: relative;
      width: 340px;
      height: 180px;
      background: white;
    }
    img {
      display: block;
    }
  </style>
  <div id="canvas">
    <svg data-key="drawing" xmlns="http://www.w3.org/2000/svg" width="340" height="180">
      <defs>
        <linearGradient id="paint">
          <stop offset="0" stop-color="#176bba" />
          <stop offset="0.5" stop-color="#176bba" />
          <stop offset="0.5" stop-color="#ffb74d" />
          <stop offset="1" stop-color="#ffb74d" />
        </linearGradient>
        <clipPath id="clip"><rect x="10" y="20" width="120" height="100" /></clipPath>
        <mask id="mask" maskUnits="userSpaceOnUse" x="0" y="0" width="140" height="140">
          <rect width="70" height="140" fill="white" />
        </mask>
      </defs>
      <g transform="translate(20 20)" clip-path="url(#clip)" mask="url(#mask)">
        <rect width="140" height="140" fill="url(#paint)" />
        <rect x="40" y="40" width="80" height="60" fill="#16a085" />
      </g>
      <g transform="translate(180 20)" clip-path="url(#clip)" mask="url(#mask)" opacity="0.5">
        <rect width="140" height="140" fill="url(#paint)" />
        <rect x="40" y="40" width="80" height="60" fill="#16a085" />
      </g>
    </svg>
  </div>
</html>
