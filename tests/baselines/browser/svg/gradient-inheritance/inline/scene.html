<!doctype html>
<html lang="en">
  <meta charset="utf-8" /><title>svg/gradient-inheritance/inline</title
  ><style>
    @font-face {
      font-family: "Test Sans";
      src: url("/tests/resources/NotoSans.ttf");
      font-weight: 100 900;
    }
    @font-face {
      font-family: "Test Sans";
      src: url("/tests/resources/NotoSansItalic.ttf");
      font-weight: 100 900;
      font-style: italic;
    }
    body {
      margin: 0;
    }
    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }
    #canvas {
      position: relative;
      width: 340px;
      height: 180px;
      background: white;
    }
    img {
      display: block;
    }
  </style>
  <div id="canvas">
    <svg data-key="drawing" xmlns="http://www.w3.org/2000/svg" width="340" height="180">
      <defs>
        <linearGradient id="base">
          <stop offset="0" stop-color="#176bba" />
          <stop offset="0.5" stop-color="#176bba" />
          <stop offset="0.5" stop-color="#ffb74d" />
          <stop offset="1" stop-color="#ffb74d" />
        </linearGradient>
        <linearGradient id="vertical" href="#base" x1="0" y1="0" x2="0" y2="1" />
        <linearGradient id="leaf" href="#vertical" gradientTransform="translate(0 1) scale(1 -1)" />
        <linearGradient id="own" href="#leaf">
          <stop offset="0" stop-color="#16a085" />
          <stop offset="1" stop-color="#16a085" />
        </linearGradient>
      </defs>
      <rect x="20" y="20" width="80" height="140" fill="url(#base)" />
      <rect x="120" y="20" width="80" height="140" fill="url(#leaf)" />
      <rect x="220" y="20" width="80" height="140" fill="url(#own)" />
    </svg>
  </div>
</html>
