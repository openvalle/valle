<!doctype html>
<html lang="en">
  <meta charset="utf-8" /><title>svg/basic-shapes/inline</title
  ><style>
    @font-face {
      font-family: "Test Sans";
      src: url("/tests/resources/NotoSans.ttf");
      font-weight: 100 900;
    }
    @font-face {
      font-family: "Test Sans";
      src: url("/tests/resources/NotoSansItalic.ttf");
      font-weight: 100 900;
      font-style: italic;
    }
    body {
      margin: 0;
    }
    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }
    #canvas {
      position: relative;
      width: 340px;
      height: 180px;
      background: white;
    }
    img {
      display: block;
    }
  </style>
  <div id="canvas">
    <svg data-key="drawing" xmlns="http://www.w3.org/2000/svg" width="340" height="180">
      <rect x="20" y="20" width="70" height="50" rx="10" fill="#176bba" />
      <circle cx="140" cy="45" r="25" fill="#16a085" />
      <ellipse cx="220" cy="45" rx="40" ry="20" fill="#ffb74d" />
      <polygon points="20,145 60,95 100,145" fill="#ad1457" />
      <polyline
        points="130,140 155,100 180,140 205,100"
        fill="none"
        stroke="#176bba"
        stroke-width="6"
      />
      <line x1="240" y1="100" x2="300" y2="145" stroke="#16a085" stroke-width="6" />
    </svg>
  </div>
</html>
