<!doctype html>
<html lang="en">
  <meta charset="utf-8" /><title>svg/gradient-spread/inline</title
  ><style>
    @font-face {
      font-family: "Test Sans";
      src: url("/tests/resources/NotoSans.ttf");
      font-weight: 100 900;
    }
    @font-face {
      font-family: "Test Sans";
      src: url("/tests/resources/NotoSansItalic.ttf");
      font-weight: 100 900;
      font-style: italic;
    }
    body {
      margin: 0;
    }
    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }
    #canvas {
      position: relative;
      width: 340px;
      height: 180px;
      background: white;
    }
    img {
      display: block;
    }
  </style>
  <div id="canvas">
    <svg data-key="drawing" xmlns="http://www.w3.org/2000/svg" width="340" height="180">
      <defs>
        <linearGradient
          id="pad"
          gradientUnits="userSpaceOnUse"
          x1="60"
          y1="0"
          x2="100"
          y2="0"
          spreadMethod="pad"
        >
          <stop offset="0" stop-color="#176bba" />
          <stop offset="0.5" stop-color="#176bba" />
          <stop offset="0.5" stop-color="#ffb74d" />
          <stop offset="1" stop-color="#ffb74d" />
        </linearGradient>
        <linearGradient
          id="repeat"
          gradientUnits="userSpaceOnUse"
          x1="60"
          y1="0"
          x2="100"
          y2="0"
          spreadMethod="repeat"
        >
          <stop offset="0" stop-color="#176bba" />
          <stop offset="0.5" stop-color="#176bba" />
          <stop offset="0.5" stop-color="#ffb74d" />
          <stop offset="1" stop-color="#ffb74d" />
        </linearGradient>
        <linearGradient
          id="reflect"
          gradientUnits="userSpaceOnUse"
          x1="60"
          y1="0"
          x2="100"
          y2="0"
          spreadMethod="reflect"
        >
          <stop offset="0" stop-color="#176bba" />
          <stop offset="0.5" stop-color="#176bba" />
          <stop offset="0.5" stop-color="#ffb74d" />
          <stop offset="1" stop-color="#ffb74d" />
        </linearGradient>
      </defs>
      <rect x="20" y="20" width="280" height="35" fill="url(#pad)" />
      <rect x="20" y="75" width="280" height="35" fill="url(#repeat)" />
      <rect x="20" y="130" width="280" height="35" fill="url(#reflect)" />
    </svg>
  </div>
</html>
