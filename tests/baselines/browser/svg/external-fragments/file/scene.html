<!doctype html>
<html lang="en">
  <meta charset="utf-8" /><title>external-fragments</title
  ><style>
    body {
      margin: 0;
    }
    * {
      box-sizing: border-box;
    }
    #canvas {
      width: 320px;
      height: 160px;
      background: white;
    }
    svg,
    img {
      display: block;
    }
  </style>
  <div id="canvas">
    <svg xmlns="http://www.w3.org/2000/svg" width="320" height="160">
      <defs><rect id="tile" width="200" height="150" fill="red" /></defs>
      <use
        href="/tests/cases/svg/external-fragments/inline/shapes.svg#tile"
        x="10"
        y="10"
        fill="#2878b8"
      />
      <use
        href="/tests/cases/svg/external-fragments/inline/shapes.svg#tile"
        x="100"
        y="10"
        fill="#d06030"
      />
      <rect
        x="200"
        y="10"
        width="100"
        height="60"
        fill="url(/tests/cases/svg/external-fragments/inline/shapes.svg#ink)"
      />
      <g clip-path="url(/tests/cases/svg/external-fragments/inline/shapes.svg#crop)">
        <rect x="10" y="100" width="180" height="50" fill="#309060" />
      </g>
      <rect
        x="210"
        y="100"
        width="80"
        height="40"
        fill="url(/tests/cases/svg/external-fragments/inline/shapes.svg#dots)"
      />
    </svg>
  </div>
</html>
