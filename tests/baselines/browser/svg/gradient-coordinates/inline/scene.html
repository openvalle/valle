<!doctype html>
<html lang="en">
  <meta charset="utf-8" /><title>svg/gradient-coordinates/inline</title
  ><style>
    @font-face {
      font-family: "Test Sans";
      src: url("/tests/resources/NotoSans.ttf");
      font-weight: 100 900;
    }
    @font-face {
      font-family: "Test Sans";
      src: url("/tests/resources/NotoSansItalic.ttf");
      font-weight: 100 900;
      font-style: italic;
    }
    body {
      margin: 0;
    }
    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }
    #canvas {
      position: relative;
      width: 340px;
      height: 180px;
      background: white;
    }
    img {
      display: block;
    }
  </style>
  <div id="canvas">
    <svg data-key="drawing" xmlns="http://www.w3.org/2000/svg" width="340" height="180">
      <defs>
        <linearGradient id="user" gradientUnits="userSpaceOnUse" x1="20" y1="0" x2="300" y2="0">
          <stop offset="0" stop-color="#176bba" />
          <stop offset="1" stop-color="#ffb74d" />
        </linearGradient>
        <linearGradient id="box">
          <stop offset="0" stop-color="#176bba" />
          <stop offset="1" stop-color="#ffb74d" />
        </linearGradient>
        <linearGradient id="flip" href="#box" gradientTransform="translate(1 0) scale(-1 1)" />
      </defs>
      <rect x="20" y="20" width="80" height="40" fill="url(#user)" />
      <rect x="140" y="20" width="160" height="40" fill="url(#user)" />
      <rect x="20" y="80" width="80" height="40" fill="url(#box)" />
      <rect x="140" y="80" width="160" height="40" fill="url(#box)" />
      <rect x="20" y="140" width="280" height="30" fill="url(#flip)" />
    </svg>
  </div>
</html>
