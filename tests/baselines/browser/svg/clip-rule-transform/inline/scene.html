<!doctype html>
<html lang="en">
  <meta charset="utf-8" /><title>svg/clip-rule-transform/inline</title
  ><style>
    @font-face {
      font-family: "Test Sans";
      src: url("/tests/resources/NotoSans.ttf");
      font-weight: 100 900;
    }
    @font-face {
      font-family: "Test Sans";
      src: url("/tests/resources/NotoSansItalic.ttf");
      font-weight: 100 900;
      font-style: italic;
    }
    body {
      margin: 0;
    }
    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }
    #canvas {
      position: relative;
      width: 340px;
      height: 180px;
      background: white;
    }
    img {
      display: block;
    }
  </style>
  <div id="canvas">
    <svg data-key="drawing" xmlns="http://www.w3.org/2000/svg" width="340" height="180">
      <defs>
        <clipPath id="hole" clipPathUnits="userSpaceOnUse" transform="translate(10 10)">
          <path clip-rule="evenodd" d="M0 0H100V100H0Z M25 25H75V75H25Z" />
        </clipPath>
        <clipPath
          id="box"
          clipPathUnits="objectBoundingBox"
          transform="translate(125 40) scale(0.5)"
        >
          <rect width="1" height="1" />
        </clipPath>
      </defs>
      <g transform="translate(20 20)">
        <rect width="120" height="120" fill="#176bba" clip-path="url(#hole)" />
      </g>
      <rect x="180" y="20" width="140" height="120" fill="#16a085" clip-path="url(#box)" />
    </svg>
  </div>
</html>
