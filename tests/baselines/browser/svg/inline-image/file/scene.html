<!doctype html>
<html lang="en">
  <meta charset="utf-8" /><title>inline-image</title
  ><style>
    body {
      margin: 0;
    }
    * {
      box-sizing: border-box;
    }
    #canvas {
      width: 320px;
      height: 160px;
      background: white;
    }
    svg,
    img {
      display: block;
    }
  </style>
  <div id="canvas">
    <svg xmlns="http://www.w3.org/2000/svg" width="320" height="160">
      <defs>
        <clipPath id="crop"><rect x="210" y="20" width="80" height="70" /></clipPath>
      </defs>
      <image
        href="/tests/cases/svg/inline-image/file/vector.svg"
        x="10"
        y="10"
        width="80"
        height="100"
      />
      <image
        href="/tests/cases/svg/inline-image/file/raster.png"
        x="110"
        y="10"
        width="80"
        height="100"
        preserveAspectRatio="none"
        image-rendering="pixelated"
      />
      <image
        href="/tests/cases/svg/inline-image/file/vector.svg"
        x="200"
        y="10"
        width="100"
        height="100"
        preserveAspectRatio="xMaxYMin slice"
        clip-path="url(#crop)"
      />
      <g transform="translate(20 120) scale(2)">
        <image
          href="/tests/cases/svg/inline-image/file/raster.png"
          width="40"
          height="10"
          preserveAspectRatio="none"
          image-rendering="pixelated"
        />
      </g>
    </svg>
  </div>
</html>
