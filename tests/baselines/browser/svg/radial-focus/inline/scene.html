<!doctype html>
<html lang="en">
  <meta charset="utf-8" /><title>svg/radial-focus/inline</title
  ><style>
    @font-face {
      font-family: "Test Sans";
      src: url("/tests/resources/NotoSans.ttf");
      font-weight: 100 900;
    }
    @font-face {
      font-family: "Test Sans";
      src: url("/tests/resources/NotoSansItalic.ttf");
      font-weight: 100 900;
      font-style: italic;
    }
    body {
      margin: 0;
    }
    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }
    #canvas {
      position: relative;
      width: 340px;
      height: 180px;
      background: white;
    }
    img {
      display: block;
    }
  </style>
  <div id="canvas">
    <svg data-key="drawing" xmlns="http://www.w3.org/2000/svg" width="340" height="180">
      <defs>
        <radialGradient id="center">
          <stop offset="0" stop-color="#fff" />
          <stop offset="1" stop-color="#176bba" />
        </radialGradient>
        <radialGradient id="focus" href="#center" fx="0.25" fy="0.35" />
        <radialGradient id="inner" href="#center" fx="0.4" fy="0.5" fr="0.15" />
      </defs>
      <rect x="20" y="20" width="90" height="140" fill="url(#center)" />
      <rect x="125" y="20" width="90" height="140" fill="url(#focus)" />
      <rect x="230" y="20" width="90" height="140" fill="url(#inner)" />
    </svg>
  </div>
</html>
