<!doctype html>
<html lang="en">
  <meta charset="utf-8" /><title>svg/marker-units/inline</title
  ><style>
    @font-face {
      font-family: "Test Sans";
      src: url("/tests/resources/NotoSans.ttf");
      font-weight: 100 900;
    }
    @font-face {
      font-family: "Test Sans";
      src: url("/tests/resources/NotoSansItalic.ttf");
      font-weight: 100 900;
      font-style: italic;
    }
    body {
      margin: 0;
    }
    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }
    #canvas {
      position: relative;
      width: 340px;
      height: 180px;
      background: white;
    }
    img {
      display: block;
    }
  </style>
  <div id="canvas">
    <svg data-key="drawing" xmlns="http://www.w3.org/2000/svg" width="340" height="180">
      <defs>
        <marker
          id="stroke"
          markerWidth="4"
          markerHeight="4"
          refX="2"
          refY="2"
          orient="auto"
          markerUnits="strokeWidth"
        >
          <rect width="4" height="4" fill="#ffb74d" />
        </marker>
        <marker
          id="user"
          markerWidth="12"
          markerHeight="12"
          refX="6"
          refY="6"
          orient="auto"
          markerUnits="userSpaceOnUse"
        >
          <rect width="12" height="12" fill="#16a085" />
        </marker>
      </defs>
      <path
        d="M30 30H130"
        fill="none"
        stroke="#176bba"
        stroke-width="2"
        marker-end="url(#stroke)"
      />
      <path
        d="M30 80H130"
        fill="none"
        stroke="#176bba"
        stroke-width="6"
        marker-end="url(#stroke)"
      />
      <path d="M200 30H300" fill="none" stroke="#176bba" stroke-width="2" marker-end="url(#user)" />
      <path d="M200 80H300" fill="none" stroke="#176bba" stroke-width="6" marker-end="url(#user)" />
    </svg>
  </div>
</html>
