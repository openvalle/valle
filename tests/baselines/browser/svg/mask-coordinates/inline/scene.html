<!doctype html>
<html lang="en">
  <meta charset="utf-8" /><title>svg/mask-coordinates/inline</title
  ><style>
    @font-face {
      font-family: "Test Sans";
      src: url("/tests/resources/NotoSans.ttf");
      font-weight: 100 900;
    }
    @font-face {
      font-family: "Test Sans";
      src: url("/tests/resources/NotoSansItalic.ttf");
      font-weight: 100 900;
      font-style: italic;
    }
    body {
      margin: 0;
    }
    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }
    #canvas {
      position: relative;
      width: 340px;
      height: 180px;
      background: white;
    }
    img {
      display: block;
    }
  </style>
  <div id="canvas">
    <svg data-key="drawing" xmlns="http://www.w3.org/2000/svg" width="340" height="180">
      <defs>
        <mask id="region" maskUnits="objectBoundingBox" x="0.25" y="0.25" width="0.5" height="0.5">
          <rect width="340" height="180" fill="white" />
        </mask>
        <mask
          id="content"
          maskUnits="userSpaceOnUse"
          x="0"
          y="0"
          width="340"
          height="180"
          maskContentUnits="objectBoundingBox"
        >
          <rect x="0.25" y="0.25" width="0.5" height="0.5" fill="white" />
        </mask>
      </defs>
      <rect x="20" y="20" width="120" height="140" fill="#176bba" mask="url(#region)" />
      <rect x="180" y="40" width="140" height="100" fill="#16a085" mask="url(#content)" />
    </svg>
  </div>
</html>
