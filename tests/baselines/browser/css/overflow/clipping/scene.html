<!doctype html>
<html lang="en">
  <meta charset="utf-8" /><title>css/overflow/clipping</title
  ><style>
    @font-face {
      font-family: "Test Sans";
      src: url("/tests/resources/NotoSans.ttf");
      font-weight: 100 900;
    }
    @font-face {
      font-family: "Test Sans";
      src: url("/tests/resources/NotoSansItalic.ttf");
      font-weight: 100 900;
      font-style: italic;
    }
    body {
      margin: 0;
    }
    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }
    #canvas {
      position: relative;
      width: 340px;
      height: 160px;
      background: white;
    }
    img {
      display: block;
    }
  </style>
  <div id="canvas">
    <div style="position: relative; width: 340px; height: 160px; background-color: white">
      <div
        data-key="hidden"
        style="
          position: absolute;
          left: 30px;
          top: 30px;
          width: 120px;
          height: 100px;
          background-color: #eef2f7;
          overflow: hidden;
        "
      >
        <div
          style="
            position: absolute;
            left: -20px;
            top: 20px;
            width: 160px;
            height: 40px;
            background-color: #176bba;
          "
        ></div>
      </div>
      <div
        data-key="visible"
        style="
          position: absolute;
          left: 190px;
          top: 30px;
          width: 120px;
          height: 100px;
          background-color: #eef2f7;
          overflow: visible;
        "
      >
        <div
          style="
            position: absolute;
            left: -20px;
            top: 20px;
            width: 160px;
            height: 40px;
            background-color: #176bba;
          "
        ></div>
      </div>
    </div>
  </div>
</html>
