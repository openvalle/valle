<!doctype html>
<html lang="en">
  <meta charset="utf-8" /><title>css/sizing/intrinsic-width</title
  ><style>
    @font-face {
      font-family: "Test Sans";
      src: url("/tests/resources/NotoSans.ttf");
      font-weight: 100 900;
    }
    @font-face {
      font-family: "Test Sans";
      src: url("/tests/resources/NotoSansItalic.ttf");
      font-weight: 100 900;
      font-style: italic;
    }
    body {
      margin: 0;
    }
    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }
    #canvas {
      position: relative;
      width: 380px;
      height: 180px;
      background: white;
    }
    img {
      display: block;
    }
  </style>
  <div id="canvas">
    <div style="position: relative; width: 380px; height: 180px; background-color: white">
      <div
        data-key="min"
        style="
          position: absolute;
          left: 20px;
          top: 20px;
          width: min-content;
          display: flex;
          flex-wrap: wrap;
          gap: 10px;
          background-color: #eef2f7;
        "
      >
        <div style="width: 60px; height: 30px; flex-shrink: 0; background-color: #176bba"></div>
        <div style="width: 100px; height: 30px; flex-shrink: 0; background-color: #16a085"></div>
      </div>
      <div
        data-key="max"
        style="
          position: absolute;
          left: 180px;
          top: 20px;
          width: max-content;
          display: flex;
          flex-wrap: wrap;
          gap: 10px;
          background-color: #eef2f7;
        "
      >
        <div style="width: 60px; height: 30px; flex-shrink: 0; background-color: #176bba"></div>
        <div style="width: 100px; height: 30px; flex-shrink: 0; background-color: #16a085"></div>
      </div>
    </div>
  </div>
</html>
