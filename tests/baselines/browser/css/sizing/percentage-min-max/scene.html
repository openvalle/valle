<!doctype html>
<html lang="en">
  <meta charset="utf-8" /><title>css/sizing/percentage-min-max</title
  ><style>
    @font-face {
      font-family: "Test Sans";
      src: url("/tests/resources/NotoSans.ttf");
      font-weight: 100 900;
    }
    @font-face {
      font-family: "Test Sans";
      src: url("/tests/resources/NotoSansItalic.ttf");
      font-weight: 100 900;
      font-style: italic;
    }
    body {
      margin: 0;
    }
    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }
    #canvas {
      position: relative;
      width: 360px;
      height: 180px;
      background: white;
    }
    img {
      display: block;
    }
  </style>
  <div id="canvas">
    <div style="position: relative; width: 360px; height: 180px; background-color: white">
      <div
        data-key="parent"
        style="
          position: absolute;
          left: 20px;
          top: 20px;
          width: 320px;
          height: 140px;
          background-color: #eef2f7;
        "
      >
        <div
          data-key="parent/max"
          style="width: 75%; max-width: 200px; height: 30px; background-color: #176bba"
        ></div>
        <div
          data-key="parent/min"
          style="width: 25%; min-width: 120px; height: 30px; background-color: #16a085"
        ></div>
        <div
          data-key="parent/calc"
          style="width: calc(50% - 20px); height: 30px; background-color: #ffb74d"
        ></div>
      </div>
    </div>
  </div>
</html>
