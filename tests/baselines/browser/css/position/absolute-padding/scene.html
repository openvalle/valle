<!doctype html>
<html lang="en">
  <meta charset="utf-8" /><title>css/position/absolute-padding</title
  ><style>
    @font-face {
      font-family: "Test Sans";
      src: url("/tests/resources/NotoSans.ttf");
      font-weight: 100 900;
    }
    @font-face {
      font-family: "Test Sans";
      src: url("/tests/resources/NotoSansItalic.ttf");
      font-weight: 100 900;
      font-style: italic;
    }
    body {
      margin: 0;
    }
    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }
    #canvas {
      position: relative;
      width: 300px;
      height: 220px;
      background: white;
    }
    img {
      display: block;
    }
  </style>
  <div id="canvas">
    <div style="position: relative; width: 300px; height: 220px; background-color: white">
      <div
        data-key="outer"
        style="
          position: absolute;
          left: 20px;
          top: 20px;
          width: 240px;
          height: 160px;
          background-color: #eef2f7;
          padding: 20px;
          border: 4px solid #17324d;
        "
      >
        <div
          data-key="outer/static"
          style="width: 100px; height: 80px; padding: 10px; background-color: #176bba"
        >
          <div
            data-key="outer/static/placed"
            style="
              position: absolute;
              right: 10px;
              bottom: 10px;
              width: 50%;
              height: 50%;
              background-color: #ffb74d;
            "
          ></div>
        </div>
      </div>
    </div>
  </div>
</html>
