<!doctype html>
<html lang="en">
  <meta charset="utf-8" /><title>css/position/absolute-relative</title
  ><style>
    @font-face {
      font-family: "Test Sans";
      src: url("/tests/resources/NotoSans.ttf");
      font-weight: 100 900;
    }
    @font-face {
      font-family: "Test Sans";
      src: url("/tests/resources/NotoSansItalic.ttf");
      font-weight: 100 900;
      font-style: italic;
    }
    body {
      margin: 0;
    }
    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }
    #canvas {
      position: relative;
      width: 340px;
      height: 220px;
      background: white;
    }
    img {
      display: block;
    }
  </style>
  <div id="canvas">
    <div style="position: relative; width: 340px; height: 220px; background-color: white">
      <div
        data-key="parent"
        style="
          position: absolute;
          left: 20px;
          top: 20px;
          width: 300px;
          height: 180px;
          background-color: #eef2f7;
          border: 4px solid #102a43;
          padding: 10px;
        "
      >
        <div
          data-key="parent/stretch"
          style="
            position: absolute;
            left: 10px;
            right: 20px;
            top: 12px;
            height: 30px;
            background-color: #176bba;
          "
        ></div>
        <div
          data-key="parent/relative"
          style="
            position: relative;
            left: 16px;
            top: 70px;
            width: 100px;
            height: 40px;
            background-color: #16a085;
          "
        ></div>
        <div
          data-key="parent/flow"
          style="width: 80px; height: 30px; background-color: #ffb74d"
        ></div>
      </div>
    </div>
  </div>
</html>
