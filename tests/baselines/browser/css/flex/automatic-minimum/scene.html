<!doctype html>
<html lang="en">
  <meta charset="utf-8" /><title>css/flex/automatic-minimum</title
  ><style>
    @font-face {
      font-family: "Test Sans";
      src: url("/tests/resources/NotoSans.ttf");
      font-weight: 100 900;
    }
    @font-face {
      font-family: "Test Sans";
      src: url("/tests/resources/NotoSansItalic.ttf");
      font-weight: 100 900;
      font-style: italic;
    }
    body {
      margin: 0;
    }
    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }
    #canvas {
      position: relative;
      width: 360px;
      height: 190px;
      background: white;
    }
    img {
      display: block;
    }
  </style>
  <div id="canvas">
    <div style="position: relative; width: 360px; height: 190px; background-color: white">
      <div
        data-key="auto"
        style="
          position: absolute;
          left: 20px;
          top: 20px;
          width: 220px;
          height: 60px;
          background-color: #eef2f7;
          display: flex;
        "
      >
        <div data-key="auto/item" style="flex: 1 1 200px; background-color: #16a085">
          <div style="width: 180px; height: 20px; background-color: #176bba"></div>
        </div>
        <div
          data-key="auto/fixed"
          style="width: 80px; flex-shrink: 0; background-color: #ffb74d"
        ></div>
      </div>
      <div
        data-key="zero"
        style="
          position: absolute;
          left: 20px;
          top: 110px;
          width: 220px;
          height: 60px;
          background-color: #eef2f7;
          display: flex;
        "
      >
        <div
          data-key="zero/item"
          style="flex: 1 1 200px; background-color: #16a085; min-width: 0px"
        >
          <div style="width: 180px; height: 20px; background-color: #176bba"></div>
        </div>
        <div
          data-key="zero/fixed"
          style="width: 80px; flex-shrink: 0; background-color: #ffb74d"
        ></div>
      </div>
    </div>
  </div>
</html>
