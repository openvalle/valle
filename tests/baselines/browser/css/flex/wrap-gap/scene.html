<!doctype html>
<html lang="en">
  <meta charset="utf-8" /><title>css/flex/wrap-gap</title
  ><style>
    @font-face {
      font-family: "Test Sans";
      src: url("/tests/resources/NotoSans.ttf");
      font-weight: 100 900;
    }
    @font-face {
      font-family: "Test Sans";
      src: url("/tests/resources/NotoSansItalic.ttf");
      font-weight: 100 900;
      font-style: italic;
    }
    body {
      margin: 0;
    }
    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }
    #canvas {
      position: relative;
      width: 320px;
      height: 200px;
      background: white;
    }
    img {
      display: block;
    }
  </style>
  <div id="canvas">
    <div style="position: relative; width: 320px; height: 200px; background-color: white">
      <div
        data-key="wrap"
        style="
          position: absolute;
          left: 20px;
          top: 20px;
          width: 220px;
          height: 160px;
          background-color: #eef2f7;
          display: flex;
          flex-wrap: wrap;
          align-content: flex-start;
          gap: 12px 20px;
        "
      >
        <div
          data-key="wrap/0"
          style="width: 100px; height: 40px; flex-shrink: 0; background-color: #176bba"
        ></div>
        <div
          data-key="wrap/1"
          style="width: 100px; height: 40px; flex-shrink: 0; background-color: #16a085"
        ></div>
        <div
          data-key="wrap/2"
          style="width: 100px; height: 40px; flex-shrink: 0; background-color: #ffb74d"
        ></div>
        <div
          data-key="wrap/3"
          style="width: 100px; height: 40px; flex-shrink: 0; background-color: #ad1457"
        ></div>
      </div>
    </div>
  </div>
</html>
