<!doctype html>
<html lang="en">
  <meta charset="utf-8" /><title>css/flex/alignment-order</title
  ><style>
    @font-face {
      font-family: "Test Sans";
      src: url("/tests/resources/NotoSans.ttf");
      font-weight: 100 900;
    }
    @font-face {
      font-family: "Test Sans";
      src: url("/tests/resources/NotoSansItalic.ttf");
      font-weight: 100 900;
      font-style: italic;
    }
    body {
      margin: 0;
    }
    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }
    #canvas {
      position: relative;
      width: 340px;
      height: 160px;
      background: white;
    }
    img {
      display: block;
    }
  </style>
  <div id="canvas">
    <div style="position: relative; width: 340px; height: 160px; background-color: white">
      <div
        data-key="row"
        style="
          position: absolute;
          left: 20px;
          top: 20px;
          width: 300px;
          height: 120px;
          background-color: #eef2f7;
          display: flex;
          justify-content: space-between;
          align-items: center;
        "
      >
        <div
          data-key="row/last"
          style="width: 40px; height: 40px; order: 2; background-color: #176bba"
        ></div>
        <div
          data-key="row/first"
          style="width: 60px; height: 60px; order: 0; background-color: #16a085"
        ></div>
        <div
          data-key="row/middle"
          style="
            width: 80px;
            height: 80px;
            order: 1;
            align-self: flex-end;
            background-color: #ffb74d;
          "
        ></div>
      </div>
    </div>
  </div>
</html>
