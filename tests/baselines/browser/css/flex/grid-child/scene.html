<!doctype html>
<html lang="en">
  <meta charset="utf-8" /><title>css/flex/grid-child</title
  ><style>
    @font-face {
      font-family: "Test Sans";
      src: url("/tests/resources/NotoSans.ttf");
      font-weight: 100 900;
    }
    @font-face {
      font-family: "Test Sans";
      src: url("/tests/resources/NotoSansItalic.ttf");
      font-weight: 100 900;
      font-style: italic;
    }
    body {
      margin: 0;
    }
    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }
    #canvas {
      position: relative;
      width: 464px;
      height: 244px;
      background: white;
    }
    img {
      display: block;
    }
  </style>
  <div id="canvas">
    <div style="position: relative; width: 464px; height: 244px; background-color: white">
      <div
        data-key="outer"
        style="
          position: absolute;
          left: 20px;
          top: 20px;
          width: 424px;
          height: 204px;
          background-color: #eef2f7;
          display: flex;
          gap: 20px;
          padding: 10px;
          border: 2px solid #17324d;
        "
      >
        <div
          data-key="outer/side"
          style="width: 100px; flex-shrink: 0; background-color: #176bba"
        ></div>
        <div
          data-key="outer/grid"
          style="
            display: grid;
            flex: 1 1 0px;
            min-width: 0px;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: 1fr 1fr;
            column-gap: 12px;
            row-gap: 10px;
            padding: 8px;
            border: 2px solid #17324d;
          "
        >
          <div data-key="outer/grid/cell0" style="background-color: #16a085"></div>
          <div data-key="outer/grid/cell1" style="background-color: #ffb74d"></div>
          <div data-key="outer/grid/cell2" style="background-color: #176bba"></div>
          <div data-key="outer/grid/cell3" style="background-color: #a8135d"></div>
        </div>
      </div>
    </div>
  </div>
</html>
