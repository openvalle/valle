<!doctype html>
<html lang="en">
  <meta charset="utf-8" /><title>css/flex/grow-shrink</title
  ><style>
    @font-face {
      font-family: "Test Sans";
      src: url("/tests/resources/NotoSans.ttf");
      font-weight: 100 900;
    }
    @font-face {
      font-family: "Test Sans";
      src: url("/tests/resources/NotoSansItalic.ttf");
      font-weight: 100 900;
      font-style: italic;
    }
    body {
      margin: 0;
    }
    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }
    #canvas {
      position: relative;
      width: 360px;
      height: 180px;
      background: white;
    }
    img {
      display: block;
    }
  </style>
  <div id="canvas">
    <div style="position: relative; width: 360px; height: 180px; background-color: white">
      <div
        data-key="grow"
        style="
          position: absolute;
          left: 20px;
          top: 20px;
          width: 300px;
          height: 50px;
          background-color: #eef2f7;
          display: flex;
          gap: 12px;
        "
      >
        <div data-key="grow/one" style="flex: 1 1 0px; background-color: #176bba"></div>
        <div data-key="grow/two" style="flex: 2 1 0px; background-color: #16a085"></div>
      </div>
      <div
        data-key="shrink"
        style="
          position: absolute;
          left: 20px;
          top: 100px;
          width: 240px;
          height: 50px;
          background-color: #eef2f7;
          display: flex;
        "
      >
        <div
          data-key="shrink/large"
          style="width: 200px; flex-shrink: 1; background-color: #176bba"
        ></div>
        <div
          data-key="shrink/small"
          style="width: 100px; flex-shrink: 1; background-color: #ffb74d"
        ></div>
      </div>
    </div>
  </div>
</html>
