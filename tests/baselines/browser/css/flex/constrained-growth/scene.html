<!doctype html>
<html lang="en">
  <meta charset="utf-8" /><title>css/flex/constrained-growth</title
  ><style>
    @font-face {
      font-family: "Test Sans";
      src: url("/tests/resources/NotoSans.ttf");
      font-weight: 100 900;
    }
    @font-face {
      font-family: "Test Sans";
      src: url("/tests/resources/NotoSansItalic.ttf");
      font-weight: 100 900;
      font-style: italic;
    }
    body {
      margin: 0;
    }
    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }
    #canvas {
      position: relative;
      width: 340px;
      height: 160px;
      background: white;
    }
    img {
      display: block;
    }
  </style>
  <div id="canvas">
    <div style="position: relative; width: 340px; height: 160px; background-color: white">
      <div
        data-key="row"
        style="
          position: absolute;
          left: 20px;
          top: 20px;
          width: 300px;
          height: 100px;
          background-color: #eef2f7;
          display: flex;
        "
      >
        <div
          data-key="row/capped"
          style="flex: 1 1 0px; max-width: 80px; background-color: #176bba"
        ></div>
        <div data-key="row/second" style="flex: 1 1 0px; background-color: #16a085"></div>
        <div data-key="row/third" style="flex: 1 1 0px; background-color: #ffb74d"></div>
      </div>
    </div>
  </div>
</html>
