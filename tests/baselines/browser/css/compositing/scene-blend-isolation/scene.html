<!doctype html>
<html lang="en">
  <meta charset="utf-8" /><title>css/compositing/scene-blend-isolation</title
  ><style>
    @font-face {
      font-family: "Test Sans";
      src: url("/tests/resources/NotoSans.ttf");
      font-weight: 100 900;
    }
    @font-face {
      font-family: "Test Sans";
      src: url("/tests/resources/NotoSansItalic.ttf");
      font-weight: 100 900;
      font-style: italic;
    }
    body {
      margin: 0;
    }
    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }
    #canvas {
      position: relative;
      width: 660px;
      height: 180px;
      background: white;
    }
    img {
      display: block;
    }
  </style>
  <div id="canvas">
    <div style="position: relative; width: 660px; height: 180px; background-color: white">
      <div
        style="
          position: absolute;
          left: 0px;
          top: 0px;
          width: 660px;
          height: 180px;
          background-color: #ffff00;
        "
      ></div>
      <div
        style="
          position: absolute;
          left: 20px;
          top: 20px;
          width: 100px;
          height: 100px;
          background-color: #00ffff;
          mix-blend-mode: multiply;
        "
      ></div>
      <div
        style="
          position: absolute;
          left: 180px;
          top: 20px;
          width: 140px;
          height: 140px;
          background-color: transparent;
          transform-style: preserve-3d;
        "
      >
        <div
          style="
            position: absolute;
            left: 0px;
            top: 0px;
            width: 100px;
            height: 100px;
            background-color: #00ffff;
            transform: translateZ(1px);
            mix-blend-mode: multiply;
          "
        ></div>
      </div>
      <div
        style="
          position: absolute;
          left: 340px;
          top: 20px;
          width: 140px;
          height: 140px;
          background-color: #ffff00;
          transform-style: preserve-3d;
        "
      >
        <div
          style="
            position: absolute;
            left: 0px;
            top: 0px;
            width: 100px;
            height: 100px;
            background-color: #00ffff;
            transform: translateZ(1px);
            mix-blend-mode: multiply;
          "
        ></div>
      </div>
      <div
        style="
          position: absolute;
          left: 500px;
          top: 20px;
          width: 140px;
          height: 140px;
          background-color: transparent;
          transform-style: preserve-3d;
        "
      >
        <div
          style="
            position: absolute;
            left: 0px;
            top: 0px;
            width: 100px;
            height: 100px;
            background-color: #00ffff;
            transform: translateZ(1px);
            mix-blend-mode: multiply;
          "
        ></div>
        <div
          style="
            position: absolute;
            left: 40px;
            top: 40px;
            width: 100px;
            height: 100px;
            background-color: #ff00ff;
            transform: translateZ(2px);
            mix-blend-mode: multiply;
          "
        ></div>
      </div>
    </div>
  </div>
</html>
