<!doctype html>
<html lang="en">
  <meta charset="utf-8" /><title>css/compositing/backdrop-blend/clips</title
  ><style>
    @font-face {
      font-family: "Test Sans";
      src: url("/tests/resources/NotoSans.ttf");
      font-weight: 100 900;
    }
    @font-face {
      font-family: "Test Sans";
      src: url("/tests/resources/NotoSansItalic.ttf");
      font-weight: 100 900;
      font-style: italic;
    }
    body {
      margin: 0;
    }
    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }
    #canvas {
      position: relative;
      width: 500px;
      height: 180px;
      background: white;
    }
    img {
      display: block;
    }
  </style>
  <div id="canvas">
    <div style="position: relative; width: 500px; height: 180px; background-color: white">
      <div
        style="
          position: absolute;
          left: 0px;
          top: 0px;
          width: 500px;
          height: 180px;
          background-color: #4080c0;
        "
      ></div>
      <div
        style="
          position: absolute;
          left: 20px;
          top: 20px;
          width: 140px;
          height: 140px;
          background-color: rgb(255 128 0 / 50%);
          backdrop-filter: invert(1);
          mix-blend-mode: multiply;
          clip-path: inset(10px);
          mask-image: linear-gradient(to right, black 50%, transparent 50%);
          opacity: 1;
        "
      >
        <div
          style="
            position: absolute;
            left: 30px;
            top: 30px;
            width: 80px;
            height: 70px;
            background-color: #00ff80;
          "
        ></div>
      </div>
      <div
        style="
          position: absolute;
          left: 180px;
          top: 20px;
          width: 140px;
          height: 140px;
          background-color: rgb(255 128 0 / 50%);
          backdrop-filter: invert(1);
          mix-blend-mode: multiply;
          clip-path: inset(10px);
          mask-image: linear-gradient(to right, black 50%, transparent 50%);
          opacity: 0.5;
        "
      >
        <div
          style="
            position: absolute;
            left: 30px;
            top: 30px;
            width: 80px;
            height: 70px;
            background-color: #00ff80;
          "
        ></div>
      </div>
      <div
        style="
          position: absolute;
          left: 340px;
          top: 20px;
          width: 140px;
          height: 140px;
          background-color: rgb(255 128 0 / 50%);
          backdrop-filter: invert(1);
          mix-blend-mode: multiply;
          clip-path: inset(10px);
          mask-image: linear-gradient(to right, black 50%, transparent 50%);
          opacity: 0;
        "
      >
        <div
          style="
            position: absolute;
            left: 30px;
            top: 30px;
            width: 80px;
            height: 70px;
            background-color: #00ff80;
          "
        ></div>
      </div>
    </div>
  </div>
</html>
