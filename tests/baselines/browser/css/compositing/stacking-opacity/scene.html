<!doctype html>
<html lang="en">
  <meta charset="utf-8" /><title>css/compositing/stacking-opacity</title
  ><style>
    @font-face {
      font-family: "Test Sans";
      src: url("/tests/resources/NotoSans.ttf");
      font-weight: 100 900;
    }
    @font-face {
      font-family: "Test Sans";
      src: url("/tests/resources/NotoSansItalic.ttf");
      font-weight: 100 900;
      font-style: italic;
    }
    body {
      margin: 0;
    }
    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }
    #canvas {
      position: relative;
      width: 340px;
      height: 180px;
      background: white;
    }
    img {
      display: block;
    }
  </style>
  <div id="canvas">
    <div style="position: relative; width: 340px; height: 180px; background-color: white">
      <div
        style="
          position: absolute;
          left: 0px;
          top: 0px;
          width: 340px;
          height: 180px;
          background-color: #eef2f7;
        "
      ></div>
      <div
        style="
          position: absolute;
          left: 20px;
          top: 20px;
          width: 140px;
          height: 140px;
          background-color: transparent;
        "
      >
        <div
          style="
            position: absolute;
            left: 0px;
            top: 0px;
            width: 110px;
            height: 110px;
            background-color: #176bba;
          "
        >
          <div
            style="
              position: absolute;
              left: 60px;
              top: 60px;
              width: 80px;
              height: 80px;
              background-color: #ffb74d;
              z-index: 100;
            "
          ></div>
        </div>
        <div
          style="
            position: absolute;
            left: 30px;
            top: 30px;
            width: 80px;
            height: 80px;
            background-color: #16a085;
            z-index: 1;
          "
        ></div>
      </div>
      <div
        style="
          position: absolute;
          left: 180px;
          top: 20px;
          width: 140px;
          height: 140px;
          background-color: transparent;
        "
      >
        <div
          style="
            position: absolute;
            left: 0px;
            top: 0px;
            width: 110px;
            height: 110px;
            background-color: #176bba;
            opacity: 0.5;
          "
        >
          <div
            style="
              position: absolute;
              left: 60px;
              top: 60px;
              width: 80px;
              height: 80px;
              background-color: #ffb74d;
              z-index: 100;
            "
          ></div>
        </div>
        <div
          style="
            position: absolute;
            left: 30px;
            top: 30px;
            width: 80px;
            height: 80px;
            background-color: #16a085;
            z-index: 1;
          "
        ></div>
      </div>
    </div>
  </div>
</html>
