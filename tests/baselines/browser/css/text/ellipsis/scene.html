<!doctype html>
<html lang="en">
  <meta charset="utf-8" /><title>css/text/ellipsis</title
  ><style>
    @font-face {
      font-family: "Test Sans";
      src: url("/tests/resources/NotoSans.ttf");
      font-weight: 100 900;
    }
    @font-face {
      font-family: "Test Sans";
      src: url("/tests/resources/NotoSansItalic.ttf");
      font-weight: 100 900;
      font-style: italic;
    }
    body {
      margin: 0;
    }
    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }
    #canvas {
      position: relative;
      width: 380px;
      height: 110px;
      background: white;
    }
    img {
      display: block;
    }
  </style>
  <div id="canvas">
    <div style="position: relative; width: 380px; height: 110px; background-color: white">
      <!-- prettier-ignore -->
      <div data-key="clip" style="position: absolute; left: 20px; top: 20px; width: 160px; height: 60px; background-color: #f4f7fa; padding: 4px; font-family: &quot;Test Sans&quot;; font-size: 24px; line-height: 32px; color: #17324d; white-space: nowrap; overflow: hidden; text-overflow: clip">Valle renders every frame</div>
      <!-- prettier-ignore -->
      <div data-key="ellipsis" style="position: absolute; left: 200px; top: 20px; width: 160px; height: 60px; background-color: #f4f7fa; padding: 4px; font-family: &quot;Test Sans&quot;; font-size: 24px; line-height: 32px; color: #17324d; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Valle renders every frame</div>
    </div>
  </div>
</html>
