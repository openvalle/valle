<!doctype html><meta charset="utf-8" /><title>Inline alignment</title
><style>
  @font-face {
    font-family: Test;
    src: url("/tests/resources/NotoSans.ttf");
    font-weight: 100 900;
  }
  body {
    margin: 0;
  }
  * {
    box-sizing: border-box;
  }
  #canvas {
    width: 720px;
    height: 300px;
    position: relative;
    background: white;
    font-family: Test;
    color: #17365d;
  }
  .line {
    position: absolute;
    font-size: 32px;
    line-height: 48px;
    width: 220px;
    height: 58px;
  }
  .small {
    font-size: 20px;
    line-height: 26px;
    background: #ffebae;
  }
</style>
