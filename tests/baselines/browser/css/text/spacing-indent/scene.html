<!doctype html>
<html lang="en">
  <meta charset="utf-8" /><title>css/text/spacing-indent</title
  ><style>
    @font-face {
      font-family: "Test Sans";
      src: url("/tests/resources/NotoSans.ttf");
      font-weight: 100 900;
    }
    @font-face {
      font-family: "Test Sans";
      src: url("/tests/resources/NotoSansItalic.ttf");
      font-weight: 100 900;
      font-style: italic;
    }
    body {
      margin: 0;
    }
    *,
    *::before,
    *::after {
      box-sizing: border-box;

      position: relative;

      display: block;
    }

  <div id="canvas">
    <div style="position: relative; width: 320px; height: 160px; background-color: white">
      <!-- prettier-ignore -->
      <div data-key="text" style="position: absolute; left: 20px; top: 20px; width: 260px; height: 110px; background-color: #f4f7fa; padding: 4px; font-family: &quot;Test Sans&quot;; font-size: 24px; line-height: 32px; color: #17324d; white-space: pre; letter-spacing: 2px; word-spacing: 4px; text-indent: 20px" data-text="">MM MM&#10;MM</div>
    </div>
  </div>
</html>
