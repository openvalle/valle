<!doctype html><meta charset="utf-8" /><title>Font size keywords</title
><style>
  body {
    margin: 0;
  }
  * {
    box-sizing: border-box;
  }
  #canvas {
    position: relative;
    width: 440px;
    height: 260px;
    background: white;
  }
  .box {
    position: absolute;
    height: 16px;
    background: #2878b8;
  }
</style>
<div id="canvas">
  <div
    class="box"
    data-key="s0"
    style="left: 12px; top: 12px; font-size: xx-small; width: 4em"
  ></div>
  <div class="box" style="left: 220px; top: 12px; width: 36px"></div>
  <div
    class="box"
    data-key="s1"
    style="left: 12px; top: 42px; font-size: x-small; width: 4em"
  ></div>
  <div class="box" style="left: 220px; top: 42px; width: 40px"></div>
  <div class="box" data-key="s2" style="left: 12px; top: 72px; font-size: small; width: 4em"></div>
  <div class="box" style="left: 220px; top: 72px; width: 52px"></div>
  <div
    class="box"
    data-key="s3"
    style="left: 12px; top: 102px; font-size: medium; width: 4em"
  ></div>
  <div class="box" style="left: 220px; top: 102px; width: 64px"></div>
  <div class="box" data-key="s4" style="left: 12px; top: 132px; font-size: large; width: 4em"></div>
  <div class="box" style="left: 220px; top: 132px; width: 72px"></div>
  <div
    class="box"
    data-key="s5"
    style="left: 12px; top: 162px; font-size: x-large; width: 4em"
  ></div>
  <div class="box" style="left: 220px; top: 162px; width: 96px"></div>
  <div
    class="box"
    data-key="s6"
    style="left: 12px; top: 192px; font-size: xx-large; width: 4em"
  ></div>
  <div class="box" style="left: 220px; top: 192px; width: 128px"></div>
  <div style="position: absolute; left: 12px; top: 226px; font-size: 30px">
    <div
      data-key="relative"
      style="font: smaller/1 sans-serif; width: 4em; height: 16px; background: #2878b8"
    ></div>
  </div>
</div>
