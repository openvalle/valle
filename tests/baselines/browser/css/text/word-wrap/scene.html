<!doctype html>
<html lang="en">
  <meta charset="utf-8" /><title>css/text/word-wrap</title
  ><style>
    @font-face {
      font-family: "Test Sans";
      src: url("/tests/resources/NotoSans.ttf");
      font-weight: 100 900;
    }
    @font-face {
      font-family: "Test Sans";
      src: url("/tests/resources/NotoSansItalic.ttf");

    </div>
  </div>
</html>
