<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
      }
      #canvas {
        position: relative;
        width: 460px;
        height: 260px;
        background: white;
      }
      .track {
        position: absolute;
        left: 20px;
        height: 100px;
        border: 4px solid #cbd5e1;
        padding: 10px;
        background: #f1f5f9;
      }
      .dot {
        position: absolute;
        width: 14px;
        height: 10px;
        background: #2563eb;
        offset-path: shape(from 10% 50%, curve to 90% 50% with 30% 0 / 70% 100%) border-box;
        offset-rotate: auto;
        offset-anchor: center;
      }
      .second .dot {
        background: #c026d3;
        offset-path: shape(from 10% 50%, curve to 90% 50% with 30% 0 / 70% 100%) content-box;
      }
    </style>
  </head>
  <body>
    <div id="canvas">
      <div class="track" data-key="track-0" style="top: 20px; width: 400px">
        <div class="dot" style="offset-distance: 0%"></div>
        <div class="dot" style="offset-distance: 25%"></div>
        <div class="dot" style="offset-distance: 50%"></div>
        <div class="dot" style="offset-distance: 75%"></div>
        <div class="dot" style="offset-distance: 100%"></div>
      </div>
      <div class="track second" data-key="track-1" style="top: 140px; width: 300px">
        <div class="dot" style="offset-distance: 0%"></div>
        <div class="dot" style="offset-distance: 25%"></div>
        <div class="dot" style="offset-distance: 50%"></div>
        <div class="dot" style="offset-distance: 75%"></div>
        <div class="dot" style="offset-distance: 100%"></div>
      </div>
    </div>
  </body>
</html>
