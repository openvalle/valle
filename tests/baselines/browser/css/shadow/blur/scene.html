<!doctype html>
<html lang="en">
  <meta charset="utf-8" /><title>css/shadow/blur</title
  ><style>
    @font-face {
      font-family: "Test Sans";
      src: url("/tests/resources/NotoSans.ttf");
      font-weight: 100 900;
    }
    @font-face {
      font-family: "Test Sans";
      src: url("/tests/resources/NotoSansItalic.ttf");
      font-weight: 100 900;
      font-style: italic;
    }
    body {
      margin: 0;
    }
    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }
    #canvas {
      position: relative;
      width: 340px;
      height: 180px;
      background: white;
    }
    img {
      display: block;
    }
  </style>
  <div id="canvas">
    <div style="position: relative; width: 340px; height: 180px; background-color: white">
      <div
        style="
          position: absolute;
          left: 40px;
          top: 40px;
          width: 100px;
          height: 80px;
          background-color: #ffb74d;
          box-shadow: 4px 6px 8px #176bba;
        "
      ></div>
      <div
        style="
          position: absolute;
          left: 200px;
          top: 40px;
          width: 100px;
          height: 80px;
          background-color: #ffb74d;
          box-shadow: inset 4px 6px 8px #176bba;
        "
      ></div>
    </div>
  </div>
</html>
