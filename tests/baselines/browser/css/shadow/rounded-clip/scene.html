<!doctype html>
<html lang="en">
  <meta charset="utf-8" /><title>css/shadow/rounded-clip</title
  ><style>
    @font-face {
      font-family: "Test Sans";
      src: url("/tests/resources/NotoSans.ttf");
      font-weight: 100 900;
    }
    @font-face {
      font-family: "Test Sans";
      src: url("/tests/resources/NotoSansItalic.ttf");
      font-weight: 100 900;
      font-style: italic;
    }
    body {
      margin: 0;
    }
    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }
    #canvas {
      position: relative;
      width: 340px;
      height: 180px;
      background: white;
    }
    img {
      display: block;
    }
  </style>
  <div id="canvas">
    <div style="position: relative; width: 340px; height: 180px; background-color: white">
      <div
        style="
          position: absolute;
          left: 20px;
          top: 20px;
          width: 140px;
          height: 140px;
          background-color: #eef2f7;
          border-radius: 24px;
          overflow: hidden;
          box-shadow: 6px 6px 0 #17324d;
        "
      >
        <div
          style="
            position: absolute;
            left: -20px;
            top: 30px;
            width: 180px;
            height: 80px;
            background-color: #176bba;
            transform: translateY(10px);
            opacity: 1;
          "
        ></div>
      </div>
      <div
        style="
          position: absolute;
          left: 180px;
          top: 20px;
          width: 140px;
          height: 140px;
          background-color: #eef2f7;
          border-radius: 24px;
          overflow: hidden;
          box-shadow: 6px 6px 0 #17324d;
        "
      >
        <div
          style="
            position: absolute;
            left: -20px;
            top: 30px;
            width: 180px;
            height: 80px;
            background-color: #176bba;
            transform: translateY(10px);
            opacity: 0.5;
          "
        ></div>
      </div>
    </div>
  </div>
</html>
