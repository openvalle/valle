<!doctype html><meta charset="utf-8" /><style>
  @font-face {
    font-family: Sans;
    src: url("/tests/resources/NotoSans.ttf");
  }
  * {
    box-sizing: border-box;
  }
  body {
    margin: 0;
  }
  #canvas {
    position: relative;
    width: 480px;
    height: 280px;
    background: white;
    color: #124bcc;
  }
</style>
<div id="canvas">
  <!-- prettier-ignore -->
  <div style="position:absolute;top:20px;width:85px;height:60px;left:20px;background:color-mix(in srgb, currentColor 40%, white);border:5px solid color-mix(in srgb, currentColor, black)"></div>
  <!-- prettier-ignore -->
  <div style="position:absolute;top:20px;width:85px;height:60px;left:130px;background:linear-gradient(90deg, color-mix(in srgb, currentColor, white), color-mix(in oklab, currentColor, #22cc99))"></div>
  <!-- prettier-ignore -->
  <div style="position:absolute;top:20px;width:85px;height:60px;left:240px;background:currentColor;filter:drop-shadow(6px 6px 2px color-mix(in srgb, currentColor, transparent))"></div>
  <!-- prettier-ignore -->
  <div style="position:absolute;top:20px;width:85px;height:60px;left:350px;background:color-mix(in srgb, color-mix(in srgb, currentColor, white), black);outline:3px solid color-mix(in srgb, currentColor, white)"></div>
  <!-- prettier-ignore -->
  <div style="position:absolute;left:20px;top:100px;font-family:Sans;font-size:26px;line-height:40px;color:red;-webkit-text-fill-color:color-mix(in srgb,currentColor,white);text-shadow:1px 2px color-mix(in srgb,currentColor,black)">Rose <span style="color:blue">Blue</span></div>
  <!-- prettier-ignore -->
  <svg width="440" height="100" style="position:absolute;left:20px;top:165px"><defs><linearGradient id="mixed"><stop offset="0" stop-color="color-mix(in srgb,currentColor,white)"/><stop offset="1" stop-color="currentColor"/></linearGradient></defs><g fill="color-mix(in srgb,currentColor,white)"><circle cx="30" cy="35" r="25" color="red"/><circle cx="105" cy="35" r="25" color="blue"/><circle cx="180" cy="35" r="25" color="color-mix(in srgb,currentColor,white)"/></g><rect x="245" y="10" width="80" height="60" fill="url(#mixed)"/><rect x="345" y="10" width="80" height="60" fill="color-mix(in srgb,currentColor,transparent)" stroke="color-mix(in srgb,currentColor,black)" stroke-width="4"/></svg>
</div>
