<!doctype html>
<html lang="en">
  <meta charset="utf-8" /><title>css/background/gradients</title
  ><style>
    @font-face {
      font-family: "Test Sans";
      src: url("/tests/resources/NotoSans.ttf");
      font-weight: 100 900;
    }
    @font-face {
      font-family: "Test Sans";
      src: url("/tests/resources/NotoSansItalic.ttf");
      font-weight: 100 900;
      font-style: italic;
    }
    body {
      margin: 0;
    }
    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }
    #canvas {
      position: relative;
      width: 360px;
      height: 220px;
      background: white;
    }
    img {
      display: block;
    }
  </style>
  <div id="canvas">
    <div style="position: relative; width: 360px; height: 220px; background-color: white">
      <div
        style="
          position: absolute;
          left: 20px;
          top: 20px;
          width: 140px;
          height: 80px;
          background-color: white;
          background-image: linear-gradient(90deg in srgb, #000000, #ffffff);
        "
      ></div>
      <div
        style="
          position: absolute;
          left: 200px;
          top: 20px;
          width: 140px;
          height: 80px;
          background-color: white;
          background-image: linear-gradient(to right, #176bba 50%, #ffb74d 50%);
        "
      ></div>
      <div
        style="
          position: absolute;
          left: 20px;
          top: 130px;
          width: 140px;
          height: 70px;
          background-color: white;
          background-image: repeating-linear-gradient(
            to right,
            #176bba 0px 10px,
            #ffb74d 10px 20px
          );
        "
      ></div>
      <div
        style="
          position: absolute;
          left: 200px;
          top: 130px;
          width: 140px;
          height: 70px;
          background-color: white;
          background-image: radial-gradient(circle at center, white 0px, #176bba 30px);
        "
      ></div>
    </div>
  </div>
</html>
