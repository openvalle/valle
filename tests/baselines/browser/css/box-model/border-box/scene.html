<!doctype html>
<html lang="en">
  <meta charset="utf-8" /><title>css/box-model/border-box</title
  ><style>
    @font-face {
      font-family: "Test Sans";
      src: url("/tests/resources/NotoSans.ttf");
      font-weight: 100 900;
    }
    @font-face {
      font-family: "Test Sans";
      src: url("/tests/resources/NotoSansItalic.ttf");
      font-weight: 100 900;
      font-style: italic;
    }
    body {
      margin: 0;
    }
    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }
    #canvas {
      position: relative;
      width: 300px;
      height: 160px;
      background: white;
    }
    img {
      display: block;
    }
  </style>
  <div id="canvas">
    <div style="position: relative; width: 300px; height: 160px; background-color: white">
      <div
        data-key="border"
        style="
          position: absolute;
          left: 20px;
          top: 20px;
          width: 120px;
          height: 100px;
          background-color: #176bba;
          box-sizing: border-box;
          border: 4px solid #102a43;
          padding: 10px;
        "
      ></div>
      <div
        data-key="content"
        style="
          position: absolute;
          left: 170px;
          top: 20px;
          width: 80px;
          height: 60px;
          background-color: #ffb74d;
          box-sizing: content-box;
          border: 4px solid #102a43;
          padding: 10px;
        "
      ></div>
    </div>
  </div>
</html>
