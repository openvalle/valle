<!doctype html>
<html lang="en">
  <meta charset="utf-8" /><title>css/box-model/percentage-padding</title
  ><style>
    @font-face {
      font-family: "Test Sans";
      src: url("/tests/resources/NotoSans.ttf");
      font-weight: 100 900;
    }
    @font-face {
      font-family: "Test Sans";
      src: url("/tests/resources/NotoSansItalic.ttf");
      font-weight: 100 900;
      font-style: italic;
    }
    body {
      margin: 0;
    }
    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }
    #canvas {
      position: relative;
      width: 300px;
      height: 220px;
      background: white;
    }
    img {
      display: block;
    }
  </style>
  <div id="canvas">
    <div style="position: relative; width: 300px; height: 220px; background-color: white">
      <div
        data-key="outer"
        style="
          position: absolute;
          left: 20px;
          top: 20px;
          width: 260px;
          height: 180px;
          background-color: #eef2f7;
          padding: 10px;
          border: 10px solid #17324d;
        "
      >
        <div
          data-key="outer/child"
          style="
            width: 50%;
            height: 50%;
            padding: 10%;
            border: 2px solid #176bba;
            background-color: #16a085;
          "
        ></div>
      </div>
    </div>
  </div>
</html>
