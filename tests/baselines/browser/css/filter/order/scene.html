<!doctype html>
<html lang="en">
  <meta charset="utf-8" /><title>css/filter/order</title
  ><style>
    @font-face {
      font-family: "Test Sans";
      src: url("/tests/resources/NotoSans.ttf");
      font-weight: 100 900;
    }
    @font-face {
      font-family: "Test Sans";
      src: url("/tests/resources/NotoSansItalic.ttf");
      font-weight: 100 900;
      font-style: italic;
    }
    body {
      margin: 0;
    }
    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }
    #canvas {
      position: relative;
      width: 340px;
      height: 180px;
      background: white;
    }
    img {
      display: block;
    }
  </style>
  <div id="canvas">
    <div style="position: relative; width: 340px; height: 180px; background-color: white">
      <div
        style="
          position: absolute;
          left: 20px;
          top: 20px;
          width: 140px;
          height: 140px;
          background-color: transparent;
          filter: invert(1) brightness(0.5);
        "
      >
        <div
          style="
            position: absolute;
            left: 0px;
            top: 0px;
            width: 140px;
            height: 140px;
            background-color: #4080c0;
          "
        ></div>
        <div
          style="
            position: absolute;
            left: 40px;
            top: 40px;
            width: 60px;
            height: 60px;
            background-color: #ff0000;
          "
        ></div>
      </div>
      <div
        style="
          position: absolute;
          left: 180px;
          top: 20px;
          width: 140px;
          height: 140px;
          background-color: transparent;
          filter: brightness(0.5) invert(1);
        "
      >
        <div
          style="
            position: absolute;
            left: 0px;
            top: 0px;
            width: 140px;
            height: 140px;
            background-color: #4080c0;
          "
        ></div>
        <div
          style="
            position: absolute;
            left: 40px;
            top: 40px;
            width: 60px;
            height: 60px;
            background-color: #ff0000;
          "
        ></div>
      </div>
    </div>
  </div>
</html>
