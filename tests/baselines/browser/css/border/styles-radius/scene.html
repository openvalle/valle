<!doctype html>
<html lang="en">
  <meta charset="utf-8" /><title>css/border/styles-radius</title
  ><style>
    @font-face {
      font-family: "Test Sans";
      src: url("/tests/resources/NotoSans.ttf");
      font-weight: 100 900;
    }
    @font-face {
      font-family: "Test Sans";
      src: url("/tests/resources/NotoSansItalic.ttf");
      font-weight: 100 900;
      font-style: italic;
    }
    body {
      margin: 0;
    }
    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }
    #canvas {
      position: relative;
      width: 360px;
      height: 220px;
      background: white;
    }
    img {
      display: block;
    }
  </style>
  <div id="canvas">
    <div style="position: relative; width: 360px; height: 220px; background-color: white">
      <div
        style="
          position: absolute;
          left: 20px;
          top: 20px;
          width: 70px;
          height: 70px;
          background-color: white;
          border: 6px solid #176bba;
        "
      ></div>
      <div
        style="
          position: absolute;
          left: 105px;
          top: 20px;
          width: 70px;
          height: 70px;
          background-color: white;
          border: 6px double #176bba;
        "
      ></div>
      <div
        style="
          position: absolute;
          left: 190px;
          top: 20px;
          width: 70px;
          height: 70px;
          background-color: white;
          border: 6px dashed #176bba;
        "
      ></div>
      <div
        style="
          position: absolute;
          left: 275px;
          top: 20px;
          width: 70px;
          height: 70px;
          background-color: white;
          border: 6px dotted #176bba;
        "
      ></div>
      <div
        style="
          position: absolute;
          left: 20px;
          top: 130px;
          width: 120px;
          height: 60px;
          background-color: #ffb74d;
          border: 4px solid #102a43;
          border-radius: 20px 8px;
        "
      ></div>
      <div
        style="
          position: absolute;
          left: 200px;
          top: 120px;
          width: 120px;
          height: 80px;
          background-color: #16a085;
          border-radius: 50%;
        "
      ></div>
    </div>
  </div>
</html>
