<!doctype html>
<html lang="en">
  <meta charset="utf-8" /><title>css/grid/flex-child</title
  ><style>
    @font-face {
      font-family: "Test Sans";
      src: url("/tests/resources/NotoSans.ttf");
      font-weight: 100 900;
    }
    @font-face {
      font-family: "Test Sans";
      src: url("/tests/resources/NotoSansItalic.ttf");
      font-weight: 100 900;
      font-style: italic;
    }
    body {
      margin: 0;
    }
    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }
    #canvas {
      position: relative;
      width: 460px;
      height: 220px;
      background: white;
    }
    img {
      display: block;
    }
  </style>
  <div id="canvas">
    <div style="position: relative; width: 460px; height: 220px; background-color: white">
      <div
        data-key="outer"
        style="
          position: absolute;
          left: 20px;
          top: 20px;
          width: 420px;
          height: 180px;
          background-color: #eef2f7;
          display: grid;
          grid-template-columns: 180px 200px;
          gap: 20px;
          padding: 10px;
        "
      >
        <div
          data-key="outer/cell0"
          style="
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px;
            background-color: #dce5ef;
          "
        >
          <div
            data-key="outer/cell0/fixed"
            style="width: 30px; height: 40px; flex-shrink: 0; background-color: #176bba"
          ></div>
          <div
            data-key="outer/cell0/grow"
            style="flex: 1 1 0px; height: 40px; background-color: #16a085"
          ></div>
        </div>
        <div
          data-key="outer/cell1"
          style="
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px;
            background-color: #dce5ef;
          "
        >
          <div
            data-key="outer/cell1/fixed"
            style="width: 30px; height: 40px; flex-shrink: 0; background-color: #176bba"
          ></div>
          <div
            data-key="outer/cell1/grow"
            style="flex: 1 1 0px; height: 40px; background-color: #16a085"
          ></div>
        </div>
      </div>
    </div>
  </div>
</html>
