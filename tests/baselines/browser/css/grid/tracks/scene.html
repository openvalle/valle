<!doctype html>
<html lang="en">
  <meta charset="utf-8" /><title>css/grid/tracks</title
  ><style>
    @font-face {
      font-family: "Test Sans";
      src: url("/tests/resources/NotoSans.ttf");
      font-weight: 100 900;
    }
    @font-face {
      font-family: "Test Sans";
      src: url("/tests/resources/NotoSansItalic.ttf");
      font-weight: 100 900;
      font-style: italic;
    }
    body {
      margin: 0;
    }
    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }
    #canvas {
      position: relative;
      width: 380px;
      height: 180px;
      background: white;
    }
    img {
      display: block;
    }
  </style>
  <div id="canvas">
    <div style="position: relative; width: 380px; height: 180px; background-color: white">
      <div
        data-key="grid"
        style="
          position: absolute;
          left: 20px;
          top: 20px;
          width: 340px;
          height: 140px;
          background-color: #eef2f7;
          display: grid;
          grid-template-columns: 80px 1fr 2fr;
          grid-template-rows: 40px 60px;
          gap: 10px;
        "
      >
        <div data-key="grid/0" style="background-color: #176bba"></div>
        <div data-key="grid/1" style="background-color: #16a085"></div>
        <div data-key="grid/2" style="background-color: #ffb74d"></div>
        <div data-key="grid/3" style="background-color: #ad1457"></div>
        <div data-key="grid/4" style="background-color: #176bba"></div>
        <div data-key="grid/5" style="background-color: #16a085"></div>
      </div>
    </div>
  </div>
</html>
