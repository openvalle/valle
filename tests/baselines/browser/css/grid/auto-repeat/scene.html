<!doctype html>
<html lang="en">
  <meta charset="utf-8" /><title>css/grid/auto-repeat</title
  ><style>
    @font-face {
      font-family: "Test Sans";
      src: url("/tests/resources/NotoSans.ttf");
      font-weight: 100 900;
    }
    @font-face {
      font-family: "Test Sans";
      src: url("/tests/resources/NotoSansItalic.ttf");
      font-weight: 100 900;
      font-style: italic;
    }
    body {
      margin: 0;
    }
    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }
    #canvas {
      position: relative;
      width: 360px;
      height: 200px;
      background: white;
    }
    img {
      display: block;
    }
  </style>
  <div id="canvas">
    <div style="position: relative; width: 360px; height: 200px; background-color: white">
      <div
        data-key="auto-fill"
        style="
          position: absolute;
          left: 20px;
          top: 20px;
          width: 320px;
          height: 60px;
          background-color: #eef2f7;
          display: grid;
          grid-template-columns: repeat(auto-fill, minmax(80px, 1fr));
          gap: 10px;
        "
      >
        <div data-key="auto-fill/first" style="background-color: #176bba"></div>
        <div data-key="auto-fill/second" style="background-color: #16a085"></div>
      </div>
      <div
        data-key="auto-fit"
        style="
          position: absolute;
          left: 20px;
          top: 110px;
          width: 320px;
          height: 60px;
          background-color: #eef2f7;
          display: grid;
          grid-template-columns: repeat(auto-fit, minmax(80px, 1fr));
          gap: 10px;
        "
      >
        <div data-key="auto-fit/first" style="background-color: #176bba"></div>
        <div data-key="auto-fit/second" style="background-color: #16a085"></div>
      </div>
    </div>
  </div>
</html>
