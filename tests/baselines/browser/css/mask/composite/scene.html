<!doctype html>
<html lang="en">
  <meta charset="utf-8" /><title>css/mask/composite</title
  ><style>
    @font-face {
      font-family: "Test Sans";
      src: url("/tests/resources/NotoSans.ttf");
      font-weight: 100 900;
    }
    @font-face {
      font-family: "Test Sans";
      src: url("/tests/resources/NotoSansItalic.ttf");
      font-weight: 100 900;
      font-style: italic;
    }
    body {
      margin: 0;
    }
    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }
    #canvas {
      position: relative;
      width: 660px;
      height: 180px;
      background: white;
    }
    img {
      display: block;
    }
  </style>
  <div id="canvas">
    <div style="position: relative; width: 660px; height: 180px; background-color: white">
      <div
        style="
          position: absolute;
          left: 20px;
          top: 20px;
          width: 140px;
          height: 140px;
          background-color: #176bba;
          mask-image:
            linear-gradient(to right, black 65%, transparent 65%),
            linear-gradient(to bottom, black 50%, transparent 50%);
          mask-composite: add;
        "
      >
        <div
          style="
            position: absolute;
            left: 40px;
            top: 40px;
            width: 100px;
            height: 100px;
            background-color: #ffb74d;
          "
        ></div>
      </div>
      <div
        style="
          position: absolute;
          left: 180px;
          top: 20px;
          width: 140px;
          height: 140px;
          background-color: #176bba;
          mask-image:
            linear-gradient(to right, black 65%, transparent 65%),
            linear-gradient(to bottom, black 50%, transparent 50%);
          mask-composite: subtract;
        "
      >
        <div
          style="
            position: absolute;
            left: 40px;
            top: 40px;
            width: 100px;
            height: 100px;
            background-color: #ffb74d;
          "
        ></div>
      </div>
      <div
        style="
          position: absolute;
          left: 340px;
          top: 20px;
          width: 140px;
          height: 140px;
          background-color: #176bba;
          mask-image:
            linear-gradient(to right, black 65%, transparent 65%),
            linear-gradient(to bottom, black 50%, transparent 50%);
          mask-composite: intersect;
        "
      >
        <div
          style="
            position: absolute;
            left: 40px;
            top: 40px;
            width: 100px;
            height: 100px;
            background-color: #ffb74d;
          "
        ></div>
      </div>
      <div
        style="
          position: absolute;
          left: 500px;
          top: 20px;
          width: 140px;
          height: 140px;
          background-color: #176bba;
          mask-image:
            linear-gradient(to right, black 65%, transparent 65%),
            linear-gradient(to bottom, black 50%, transparent 50%);
          mask-composite: exclude;
        "
      >
        <div
          style="
            position: absolute;
            left: 40px;
            top: 40px;
            width: 100px;
            height: 100px;
            background-color: #ffb74d;
          "
        ></div>
      </div>
    </div>
  </div>
</html>
