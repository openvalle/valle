<!doctype html><meta charset="utf-8" /><title>CSS shape clipping</title
><style>
  * {
    box-sizing: border-box;
  }
  body {
    margin: 0;
  }
  #canvas {
    position: relative;
    width: 610px;
    height: 290px;
    background: white;
  }
</style>
<div id="canvas">
  <div
    data-key="bubble"
    style="
      position: absolute;
      left: 10px;
      top: 10px;
      width: 180px;
      height: 115px;
      background: #2563eb;
      clip-path: shape(
        from 12px 0,
        hline to calc(100% - 12px),
        curve to 100% 12px with 100% 0,
        vline to calc(100% - 32px),
        curve by -12px 12px with 0 12px,
        hline to 65%,
        line by -12px 20px,
        line by -12px -20px,
        hline to 12px,
        curve to 0 calc(100% - 32px) with 0 calc(100% - 20px),
        vline to 12px,
        curve to 12px 0 with 0 0,
        close
      );
    "
  ></div>
  <div
    data-key="small"
    style="
      position: absolute;
      left: 210px;
      top: 10px;
      width: 130px;
      height: 85px;
      background: #a855f7;
      clip-path: shape(
        from 12px 0,
        hline to calc(100% - 12px),
        curve to 100% 12px with 100% 0,
        vline to calc(100% - 32px),
        curve by -12px 12px with 0 12px,
        hline to 65%,
        line by -12px 20px,
        line by -12px -20px,
        hline to 12px,
        curve to 0 calc(100% - 32px) with 0 calc(100% - 20px),
        vline to 12px,
        curve to 12px 0 with 0 0,
        close
      );
    "
  ></div>
  <div
    data-key="hole"
    style="
      position: absolute;
      left: 410px;
      top: 10px;
      width: 180px;
      height: 115px;
      background: #16a34a;
      clip-path: shape(
        evenodd from 0 0,
        hline to right,
        vline to bottom,
        hline to left,
        close,
        move to 25% 25%,
        line to 75% 25%,
        line to 75% 75%,
        line to 25% 75%,
        close
      );
    "
  ></div>
  <div
    data-key="wave"
    style="
      position: absolute;
      left: 10px;
      top: 155px;
      width: 180px;
      height: 115px;
      background: #f97316;
      clip-path: shape(
        from 0 50%,
        curve by 50% 0 with 15% -45% / 35% -45%,
        smooth by 50% 0 with -15% 45% from end,
        line to right bottom,
        line to left bottom,
        close
      );
    "
  ></div>
  <div
    data-key="arc"
    style="
      position: absolute;
      left: 210px;
      top: 145px;
      width: 180px;
      height: 125px;
      background: #0891b2;
      clip-path: shape(
        from 20% 50%,
        arc to 80% 50% of 40% cw large rotate 15deg,
        arc to 20% 50% of 35% 20% ccw,
        close
      );
      transform: rotate(-5deg);
    "
  ></div>
  <div
    data-key="content"
    style="
      position: absolute;
      left: 410px;
      top: 155px;
      width: 180px;
      height: 115px;
      padding: 12px;
      border: 6px solid #b91c1c;
      background: #dc2626;
      clip-path: shape(
          from left top,
          curve to right center with 30% 10px from start / -10px -30% from end,
          smooth to left bottom with center bottom,
          close
        )
        content-box;
    "
  ></div>
</div>
