<!doctype html><meta charset="utf-8" /><title>vertical-grid</title
><style>
  body {
    margin: 0;
  }
  * {
    box-sizing: border-box;
  }
</style>
<div id="canvas" style="position: relative; width: 604px; height: 340px; background-color: white">
  <div
    data-key="canvas/g0"
    style="
      position: absolute;
      left: 12px;
      top: 12px;
      width: 280px;
      height: 148px;
      padding: 10px;
      border: 2px solid #17365d;
      background-color: #eef3f8;
      writing-mode: vertical-rl;
      display: grid;
      grid-template-columns: 36px 1fr;
      grid-template-rows: 42px 1fr 36px;
      gap: 8px;
      direction: ltr;
    "
  >
    <div data-key="canvas/g0/g0-0" style="background-color: #2463a0; grid-column: span 2"></div>
    <div data-key="canvas/g0/g0-1" style="background-color: #da803d"></div>
    <div
      data-key="canvas/g0/g0-2"
      style="
        background-color: #3b856c;
        writing-mode: horizontal-tb;
        aspect-ratio: 2;
        justify-self: start;
      "
    ></div>
    <div data-key="canvas/g0/g0-3" style="background-color: #936cb3"></div>
  </div>
