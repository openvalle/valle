<!doctype html>
<html lang="en">
  <meta charset="utf-8" /><title>css/layout/block-flow</title
  ><style>
    @font-face {
      font-family: "Test Sans";
      src: url("/tests/resources/NotoSans.ttf");
      font-weight: 100 900;
    }
    @font-face {
      font-family: "Test Sans";
      src: url("/tests/resources/NotoSansItalic.ttf");
      font-weight: 100 900;
      font-style: italic;
    }
    body {
      margin: 0;
    }
    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }
    #canvas {
      position: relative;
      width: 320px;
      height: 200px;
      background: white;
    }
    img {
      display: block;
    }
  </style>
  <div id="canvas">
    <div style="position: relative; width: 320px; height: 200px; background-color: white">
      <div
        data-key="flow"
        style="
          position: absolute;
          left: 20px;
          top: 20px;
          width: 280px;
          height: 160px;
          background-color: #eef2f7;
          padding: 10px;
          border: 2px solid #102a43;
        "
      >
        <div data-key="flow/full" style="height: 30px; background-color: #176bba"></div>
        <div
          data-key="flow/center"
          style="
            width: 100px;
            height: 40px;
            margin-left: auto;
            margin-right: auto;
            background-color: #16a085;
          "
        ></div>
        <div data-key="flow/last" style="height: 30px; background-color: #ffb74d"></div>
      </div>
    </div>
  </div>
</html>
