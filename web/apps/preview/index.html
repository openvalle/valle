<!doctype html>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="color-scheme" content="dark" />
<title>Valle Preview</title>
<!-- Takumi's vendored module graph uses relative imports so it also loads inside module Workers. -->
<link rel="stylesheet" href="../shared/styles.css" />
<link rel="stylesheet" href="./src/styles.css" />

<div class="app">
  <header class="topbar">
    <div class="brand">
      <svg class="mark" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M5 5 L12 19 L19 5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
      </svg>
      <span>valle</span><span class="sub">preview</span>
    </div>
    <div class="meta" id="meta"><!-- chips injected --></div>
  </header>

  <div class="stage" id="stageWrap" data-playing="false">
    <valle-player id="stage" loading-label="Preparing preview…">
      <button class="hit" id="hit" type="button" aria-label="Play / pause">
        <span class="bigplay" id="bigplay" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13l11-6.5z" /></svg>
        </span>
      </button>
      <div class="hud" id="hud" hidden></div>
    </valle-player>
  </div>

  <div class="preview-error" id="previewError" hidden><span id="previewErrorText"></span><button class="button" id="retryPreview">Retry</button></div>
  <div class="controls">
    <div class="seekrow">
      <div class="seekwrap">
        <input id="scrub" type="range" min="0" max="1" value="0" step="0.001"
               aria-label="Seek" style="--pct:0%" />
        <div class="seektip" id="seektip" hidden>0:00.000</div>
      </div>
      <span class="time"><span class="cur" id="tCur">0:00.000</span> / <span id="tDur">0:00.000</span>
        &nbsp;·&nbsp;<span class="frame" id="tFrame">f0/0</span></span>
    </div>
    <div class="transport">
      <studio-transport id="transport"></studio-transport>
      <span class="volume" id="volGroup" hidden>
        <input id="vol" type="range" min="0" max="1" step="0.01" value="1" aria-label="Volume" />
      </span>
      <details class="more"><summary class="button">More</summary>
        <button class="button" id="hudBtn" type="button" aria-pressed="false">Performance</button>
      </details>
      <button class="ctl" id="fsBtn" type="button" title="Fullscreen (F)" aria-label="Fullscreen">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3M16 3h3a2 2 0 0 1 2 2v3M8 21H5a2 2 0 0 1-2-2v-3M16 21h3a2 2 0 0 0 2-2v-3"/></svg>
      </button>
    </div>
    <div class="hints">
      <span><kbd>Space</kbd> play/pause</span>
      <span><kbd>←</kbd><kbd>→</kbd> frame</span>
      <span><kbd>J</kbd><kbd>L</kbd> ±1s</span>
      <span><kbd>Home</kbd><kbd>End</kbd> jump</span>
      <span><kbd>F</kbd> fullscreen</span>
      <span><kbd>M</kbd> mute</span>
      <span><kbd>I</kbd> stats</span>
    </div>
  </div>
</div>

<script type="module" src="./src/main.ts"></script>
