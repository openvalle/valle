<!doctype html>
<!-- WebCodecs decode harness. Sample requested times through player-core's decoder ring, convert frames to straight-alpha RGBA, and POST results to the local callback server. Query: src and comma-separated times. Results include frame times, dimensions and rgbaBase64. -->
<meta charset="utf-8" />
<title>valle webcodecs decode</title>
<script type="module">
  import { createDecoderRing } from "/packages/player-core/index.mjs";

  async function post(body) {
    await fetch("/result", {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify(body),
    });
  }

  function fail(message) {
    return post({ status: "error", message: String(message) });
  }

  async function frameToRgba(frame) {
    const width = frame.displayWidth;
    const height = frame.displayHeight;
    // Preferred path: copyTo RGBA (Chrome >= 127 supports format conversion).
    try {
      const size = width * height * 4;
      const data = new Uint8Array(size);
      await frame.copyTo(data, { format: "RGBA", colorSpace: "srgb" });
      return { width, height, data };
    } catch {
      // Fallback: raster through 2D canvas (also applies rotation/visibleRect,
      // matching the display-oriented contract of native decode).
      const canvas = new OffscreenCanvas(width, height);
      const ctx = canvas.getContext("2d");
      ctx.drawImage(frame, 0, 0, width, height);
      const image = ctx.getImageData(0, 0, width, height);
      return { width, height, data: new Uint8Array(image.data.buffer) };
    }
  }

  function base64(bytes) {
    let bin = "";
    const CHUNK = 0x8000;
    for (let i = 0; i < bytes.length; i += CHUNK) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + CHUNK));
    }
    return btoa(bin);
  }

  async function main() {
    const params = new URLSearchParams(location.search);
    const src = params.get("src");
    const times = (params.get("times") ?? "")
      .split(",")
      .filter((s) => s.length)
      .map(Number);
    if (!src || times.length === 0) throw new Error("missing src/times");
    if (typeof VideoDecoder === "undefined") {
      throw new Error("WebCodecs VideoDecoder unavailable");
    }

    const buffer = await (await fetch(src)).arrayBuffer();
    const ring = createDecoderRing({ buffer });
    const frames = [];
    try {
      for (const timeS of times) {
        const frame = await ring.frameAt(timeS);
        try {
          const rgba = await frameToRgba(frame);
          frames.push({
            timeS,
            ptsS: (frame.timestamp - ring.baseTimestampUs()) / 1_000_000,
            width: rgba.width,
            height: rgba.height,
            displayWidth: frame.displayWidth,
            displayHeight: frame.displayHeight,
            rgbaBase64: base64(rgba.data),
          });
        } finally {
          frame.close();
        }
      }
    } finally {
      ring.close();
    }

    await post({
      status: "ok",
      implementation: "webcodecs+mp4box",
      userAgent: navigator.userAgent,
      frames,
    });
  }

  main().catch(fail);
</script>
