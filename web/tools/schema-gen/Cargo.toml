[package]
name = "valle-web-schema-gen"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
license = "Apache-2.0"
publish = false

[dependencies]
serde = { version = "1.0.229", features = ["derive", "rc"] }
serde_json = { version = "=1.0.151", features = ["float_roundtrip"] }
ts-rs = { version = "12.0.1", features = ["serde-compat", "serde-json-impl", "no-serde-warnings"] }
valle-timeline = { path = "../../../crates/valle-timeline" }

# This tool is intentionally outside crates/* and the runtime wasm package.
[workspace]
