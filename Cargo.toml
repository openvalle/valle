[workspace]
resolver = "3"
members = ["crates/valle-cli", "crates/valle-engine", "crates/valle-native", "crates/valle-project", "crates/valle-timeline", "crates/valle-web", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.99"
repository = "https://github.com/openvalle/valle"
publish = false

[workspace.dependencies]
# Lavapipe, called without the Vulkan loader: the ash wgpu-hal uses, and the library loaded
# through libloading, as ash does; libc, for Linux to load it from memory where it must.
ash = { version = "0.38.0", default-features = false, features = ["std"] }
# Studio's web assets: compressed only while packaging, decoded only for clients without br;
# lavapipe, decoded when it is first used.
brotli = "9.0.0"
brotli-decompressor = "6.3.1"
# The CLI's commands, options and help.
clap = { version = "4.6.7", features = ["derive", "wrap_help"] }
# vello_cpu's scalar level, which color glyphs are rasterized at.
fearless_simd = { version = "0.7.0", default-features = false, features = ["std", "force_support_fallback"] }
image-webp = "0.2.4"
# Unicode scripts for automatic text-decoration ink skipping; also used by parley.
icu_properties = "2.4.0"
# Tests only: multi-line sources indented with the code, the indentation removed.
indoc = "2.0.8"
libc = "0.2.190"
libloading = "0.9.0"
libm = "0.2.16"
oxc = { version = "=0.158.0", features = ["ast_visit", "codegen", "semantic", "transformer"] }
# Without system fonts: every host shapes with the same bytes.
parley = { version = "0.12.0", default-features = false, features = ["std"] }
# With libm, not the platform's math: every host strokes the same outlines.
i_overlay = { version = "=9.1.0", default-features = false }
# Validate authored WGSL and read its resource bindings and uniform layout; no translation.
naga = { version = "30.0.1", default-features = false, features = ["wgsl-in"] }
kurbo = { version = "0.13.1", default-features = false, features = ["libm"] }
# Metal textures of VideoToolbox's frames on macOS, as wgpu's Metal backend has them.
objc2 = "0.6.5"
objc2-metal = { version = "0.3.2", default-features = false, features = ["std", "MTLAllocation", "MTLResource", "MTLTexture"] }
png = "0.18.1"
# The SHA-256 of downloads, and the cryptography of the TLS ureq speaks.
ring = "0.17.14"
rquickjs = "=0.14.0"
# Studio's system save dialog; Linux uses the desktop portal without GTK.
rfd = { version = "0.18.0", default-features = false, features = ["xdg-portal"] }
# Never resolves external entities: an SVG file reads nothing else.
roxmltree = "0.21.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["float_roundtrip"] }
skrifa = { version = "0.44.0", default-features = false, features = ["std"] }
taffy = { version = "0.15.1", default-features = false, features = ["std", "flexbox", "block_layout", "grid", "calc"] }
# The characters of a split text: grapheme clusters, as UAX #29 has them.
unicode-segmentation = "1.13.3"
# FFmpeg 7, 8 or 9, loaded at run time: encoding, decoding, containers and color conversion.
valle-ffmpeg = { version = "0.1.0", default-features = false, features = ["codec", "format", "software-scaling", "software-resampling"] }
# Blocking HTTPS over rustls with ring and the Mozilla roots, gzip decoded.
ureq = { version = "3.5.1", default-features = false, features = ["rustls", "gzip"] }
# Color glyphs (COLR) rasterized on the CPU, with no SIMD level picked at run time.
vello_cpu = { version = "0.3.0", default-features = false, features = ["std", "text", "u8_pipeline"] }
# The native backends only; shaders are WGSL.
wgpu = { version = "30.0.1", default-features = false, features = ["std", "parking_lot", "wgsl", "metal", "vulkan", "dx12"] }
# WOFF and WOFF2 fonts, decoded to the TrueType or OpenType file inside.
wuff = "0.2.10"
# Without SIMD: every host decodes the same pixels.
zune-jpeg = { version = "0.5.15", default-features = false, features = ["std"] }

# Dependencies are optimized in dev and test builds too: QuickJS at -O0 runs scenes several times
# slower.
[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
strip = "symbols"
