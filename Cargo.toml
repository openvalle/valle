[workspace]
resolver = "3"
members = ["crates/valle-engine", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.99"
repository = "https://github.com/openvalle/valle"
publish = false

[workspace.dependencies]
libm = "0.2.16"
oxc = { version = "=0.148.0", features = ["ast_visit", "codegen", "semantic", "transformer"] }
# Without system fonts: every host shapes with the same bytes.
parley = { version = "0.12.0", default-features = false, features = ["std"] }
rquickjs = "=0.14.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["float_roundtrip"] }
taffy = { version = "0.15.1", default-features = false, features = ["std", "flexbox", "block_layout"] }

# Dependencies are optimized in dev and test builds too: QuickJS at -O0 runs scenes several times
# slower.
[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
strip = "symbols"
